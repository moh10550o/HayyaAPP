دِينَ",c:1,s:"القرآن الكريم — سورة آل عمران: 53"},{t:"رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",c:1,s:"القرآن الكريم — سورة آل عمران: 147"},{t:"رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",c:1,s:"القرآن الكريم — سورة آل عمران: 191-194"},{t:"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",c:1,s:"القرآن الكريم — سورة الأعراف: 23"},{t:"رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ",c:1,s:"القرآن الكريم — سورة الأعراف: 47"},{t:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ",c:1,s:"القرآن الكريم — سورة الأعراف: 126"},{t:"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",c:1,s:"القرآن الكريم — سورة التوبة: 129"},{t:"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ",c:1,s:"القرآن الكريم — سورة يونس: 85-86"},{t:"رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ ۖ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ",c:1,s:"القرآن الكريم — سورة هود: 47"},{t:"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ",c:1,s:"القرآن الكريم — سورة إبراهيم: 40"},{t:"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",c:1,s:"القرآن الكريم — سورة إبراهيم: 41"},{t:"رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَل لِّي مِن لَّدُنكَ سُلْطَانًا نَّصِيرًا",c:1,s:"القرآن الكريم — سورة الإسراء: 80"},{t:"رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",c:1,s:"القرآن الكريم — سورة الكهف: 10"},{t:"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي يَفْقَهُوا قَوْلِي",c:1,s:"القرآن الكريم — سورة طه: 25-28"},{t:"رَّبِّ زِدْنِي عِلْمًا",c:1,s:"القرآن الكريم — سورة طه: 114"},{t:"لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",c:1,s:"القرآن الكريم — سورة الأنبياء: 87"},{t:"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",c:1,s:"القرآن الكريم — سورة الأنبياء: 89"},{t:"رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ",c:1,s:"القرآن الكريم — سورة المؤمنون: 97-98"},{t:"رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ",c:1,s:"القرآن الكريم — سورة المؤمنون: 109"},{t:"رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ",c:1,s:"القرآن الكريم — سورة المؤمنون: 118"}]},{k:"anbiya",ar:"أدعية الأنبياء",en:"Duas of the prophets",items:[{t:"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",c:1,h:"آدم عليه السلام",s:"القرآن الكريم — سورة الأعراف: 23"},{t:`"رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا تَبَارًا". [نُوحٍ - 28].
" رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ". [هُودٍ - 47].
"رَّبِّ أَنزِلْنِي مُنزَلًا مُّبَارَكًا وَأَنتَ خَيْرُ الْمُنزِلِينَ". [الْمُؤْمِنُونَ - 29].`,c:1,h:"نوح عليه السلام",s:"آيات من القرآن الكريم (المواضع مذكورة في النص)"},{t:`"رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ (127) رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ (128)". [الْبَقَرَةِ - 127-128].
"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ (40) رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ (41)". [إِبْرَاهِيمَ - 40-41].
"رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ (83) وَاجْعَل لِّي لِسَانَ صِدْقٍ فِي الْآخِرِينَ (84) وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ (85)". [الشُّعَرَاءِ - 83-85].
"رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ (4) رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا ۖ إِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ (5)". [الْمُمْتَحَنَةِ - 4-5].
"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ". [الصَّافَّاتِ - 100].`,c:1,h:"إبراهيم عليه السلام",s:"آيات من القرآن الكريم (المواضع مذكورة في النص)"},{t:"إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُم ۚ مَّا مِن دَابَّةٍ إِلَّا هُوَ آخِذٌ بِنَاصِيَتِهَا ۚ إِنَّ رَبِّي عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ",c:1,h:"هود عليه السلام",s:"القرآن الكريم — سورة هود: 56"},{t:`"رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ". [الْعَنْكَبُوتِ - 30].
"رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ". [الشُّعَرَاءِ - 169].`,c:1,h:"لوط عليه السلام",s:"آيات من القرآن الكريم (المواضع مذكورة في النص)"},{t:"فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ ۖ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ",c:1,h:"يوسف عليه السلام",s:"القرآن الكريم — سورة يوسف: 101"},{t:"وَسِعَ رَبُّنَا كُلَّ شَيْءٍ عِلْمًا عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنتَ خَيْرُ الْفَاتِحِينَ",c:1,h:"شعيب عليه السلام",s:"القرآن الكريم — سورة الأعراف: 89"},{t:`"رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي". [الْقَصَصِ - 16].
"رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ فَلَنْ أَكُونَ ظَهِيرًا لِّلْمُجْرِمِينَ". [الْقَصَصِ - 17].
"رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ". [الْقَصَصِ - 24].
"رَبِّ اشْرَحْ لِي صَدْرِي (25) وَيَسِّرْ لِي أَمْرِي (26) وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي (27) يَفْقَهُوا قَوْلِي (28)". [طه - 25-28].`,c:1,h:"موسى عليه السلام",s:"آيات من القرآن الكريم (المواضع مذكورة في النص)"},{t:"أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",c:1,h:"أيوب عليه السلام",s:"القرآن الكريم — سورة الأنبياء: 83"},{t:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ",c:1,h:"سليمان عليه السلام",s:"القرآن الكريم — سورة النمل: 19"},{t:"لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",c:1,h:"يونس عليه السلام",s:"القرآن الكريم — سورة الأنبياء: 87"},{t:`"رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ". [آلِ عِمْرَانَ - 38].
"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ". [الْأَنْبِيَاءِ - 89].`,c:1,h:"زكريا عليه السلام",s:"آيات من القرآن الكريم (المواضع مذكورة في النص)"},{t:"إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ",c:1,h:"يعقوب عليه السلام",s:"القرآن الكريم — سورة يوسف: 86"}]},{k:"mayyit",ar:"أدعية للميّت",en:"For the deceased",items:[{t:`اللَّهُمَّ أَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ.
اللَّهُمَّ عَامِلْهُ بِمَا أَنْتَ أَهْلُهُ، وَلَا تُعَامِلْهُ بِمَا هُوَ أَهْلُهُ.
اللَّهُمَّ اجْزِهِ عَنِ الْإِحْسَانِ إِحْسَانًا وَعَنِ الْإِسَاءَةِ عَفْوًا وَغُفْرَانًا.
اللَّهُمَّ إِنْ كَانَ مُحْسِنًا فَزِدْ مِنْ حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئًا فَتَجَاوَزْ عَنْ سَيِّئَاتِهِ.
اللَّهُمَّ أَدْخِلْهُ الْجَنَّةَ مِنْ غَيْرِ مُنَاقَشَةِ حِسَابٍ وَلَا سَابِقَةِ عَذَابٍ.
اللَّهُمَّ آنِسْهُ فِي وَحْدَتِهِ وَفِي وَحْشَتِهِ وَفِي غُرْبَتِهِ.
اللَّهُمَّ أَنْزِلْهُ مُنْزَلًا مُبَارَكًا وَأَنْتَ خَيْرُ الْمُنْزِلِينَ.
اللَّهُمَّ أَنْزِلْهُ مَنَازِلَ الصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ، وَحَسُنَ أُولَئِكَ رَفِيقًا.
اللَّهُمَّ اجْعَلْ قَبْرَهُ رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ.
اللَّهُمَّ افْسَحْ لَهُ فِي قَبْرِهِ مَدَّ بَصَرِهِ، وَافْرُشْ قَبْرَهُ مِنْ فِرَاشِ الْجَنَّةِ.
اللَّهُمَّ أَعِذْهُ مِنْ عَذَابِ الْقَبْرِ، وَجَفَافِ الْأَرْضِ عَنْ جَنْبَيْهِ.
اللَّهُمَّ امْلَأْ قَبْرَهُ بِالرِّضَا وَالنُّورِ وَالْفُسْحَةِ وَالسُّرُورِ.
اللَّهُمَّ إِنَّهُ فِي ذِمَّتِكَ وَحَبْلِ جِوَارِكَ، فَقِهِ فِتْنَةَ الْقَبْرِ، وَعَذَابَ النَّارِ، وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ، فَاغْفِرْ لَهُ وَارْحَمْهُ إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ إِنَّهُ عَبْدُكَ وَابْنُ عَبْدِكَ خَرَجَ مِنَ الدُّنْيَا وَسَعَتِهَا وَمَحْبُوبِهَا وَأَحِبَّائِهِ فِيهَا إِلَى ظُلْمَةِ الْقَبْرِ وَمَا هُوَ لَاقِيهِ.
اللَّهُمَّ إِنَّهُ كَانَ يَشْهَدُ أَنَّكَ لَا إِلَهَ إِلَّا أَنْتَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ وَأَنْتَ أَعْلَمُ بِهِ.
اللَّهُمَّ إِنَّا نَتَوَسَّلُ بِكَ إِلَيْكَ، وَنُقْسِمُ بِكَ عَلَيْكَ أَنْ تَرْحَمَهُ وَلَا تُعَذِّبَهُ، وَأَنْ تُثَبِّتَهُ عِنْدَ السُّؤَالِ.
اللَّهُمَّ إِنَّهُ نَزَلَ بِكَ وَأَنْتَ خَيْرُ مَنْزُولٍ بِهِ، وَأَصْبَحَ فَقِيرًا إِلَى رَحْمَتِكَ وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ.
اللَّهُمَّ آتِهِ بِرَحْمَتِكَ وَرِضَاكَ، وَقِهِ فِتْنَةَ الْقَبْرِ وَعَذَابَهُ، وَآتِهِ بِرَحْمَتِكَ الْأَمْنَ مِنْ عَذَابِكَ حَتَّى تَبْعَثَهُ إِلَى جَنَّتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.
اللَّهُمَّ انْقُلْهُ مِنْ مَوَاطِنِ الدُّودِ وَضِيقِ اللُّحُودِ إِلَى جَنَّاتِ الْخُلُودِ.
اللَّهُمَّ احْمِهِ تَحْتَ الْأَرْضِ، وَاسْتُرْهُ يَوْمَ الْعَرْضِ، وَلَا تُخْزِهِ يَوْمَ يُبْعَثُونَ "يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ".
اللَّهُمَّ يَمِّنْ كِتَابَهُ، وَيَسِّرْ حِسَابَهُ، وَثَقِّلْ بِالْحَسَنَاتِ مِيزَانَهُ، وَثَبِّتْ عَلَى الصِّرَاطِ أَقْدَامَهُ، وَأَسْكِنْهُ فِي أَعْلَى الْجَنَّاتِ بِجِوَارِ حَبِيبِكَ وَمُصْطَفَاكَ (صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ).
اللَّهُمَّ أَمِّنْهُ مِنْ فَزَعِ يَوْمِ الْقِيَامَةِ، وَمِنْ هَوْلِ يَوْمِ الْقِيَامَةِ، وَاجْعَلْ نَفْسَهُ آمِنَةً مُطْمَئِنَّةً، وَلَقِّنْهُ حُجَّتَهُ.
اللَّهُمَّ اجْعَلْهُ فِي بَطْنِ الْقَبْرِ مُطْمَئِنًّا وَعِنْدَ قِيَامِ الْأَشْهَادِ آمِنًا، وَبِجُودِ رِضْوَانِكَ وَاثِقًا، وَإِلَى أَعْلَى دَرَجَاتِكَ سَابِقًا.
اللَّهُمَّ اجْعَلْ عَنْ يَمِينِهِ نُورًا حَتَّى تَبْعَثَهُ آمِنًا مُطْمَئِنًّا فِي نُورٍ مِنْ نُورِكَ.
اللَّهُمَّ انْظُرْ إِلَيْهِ نَظْرَةَ رِضًا، فَإِنَّ مَنْ تَنْظُرُ إِلَيْهِ نَظْرَةَ رِضًا لَا تُعَذِّبُهُ أَبَدًا.
اللَّهُمَّ أَسْكِنْهُ فَسِيحَ الْجِنَانِ، وَاغْفِرْ لَهُ يَا رَحْمَنُ، وَارْحَمْهُ يَا رَحِيمُ، وَتَجَاوَزْ عَمَّا تَعْلَمُ يَا عَلِيمُ.
اللَّهُمَّ اعْفُ عَنْهُ فَإِنَّكَ الْقَائِلُ "وَيَعْفُو عَنْ كَثِيرٍ".
اللَّهُمَّ إِنَّهُ جَاءَ بِبَابِكَ، وَأَنَاخَ بِجَنَابِكَ، فَجُدْ عَلَيْهِ بِعَفْوِكَ وَإِكْرَامِكَ وَجُودِ إِحْسَانِكَ.
اللَّهُمَّ إِنَّ رَحْمَتَكَ وَسِعَتْ كُلَّ شَيْءٍ فَارْحَمْهُ رَحْمَةً تَطْمَئِنُّ بِهَا نَفْسُهُ، وَتَقَرُّ بِهَا عَيْنُهُ.
اللَّهُمَّ احْشُرْهُ مَعَ الْمُتَّقِينَ إِلَى الرَّحْمَنِ وَفْدًا.
اللَّهُمَّ احْشُرْهُ مَعَ أَصْحَابِ الْيَمِينِ، وَاجْعَلْ تَحِيَّتَهُ سَلَامٌ لَكَ مِنْ أَصْحَابِ الْيَمِينِ.
اللَّهُمَّ بَشِّرْهُ بِقَوْلِكَ "كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّامِ الْخَالِيَةِ".
اللَّهُمَّ اجْعَلْهُ مِنَ الَّذِينَ سُعِدُوا فِي الْجَنَّةِ خَالِدِينَ فِيهَا مَا دَامَتِ السَّمَاوَاتُ وَالْأَرْضُ.
اللَّهُمَّ لَا نُزَكِّيهِ عَلَيْكَ، وَلَكِنَّا نَحْسَبُهُ أَنَّهُ آمَنَ وَعَمِلَ صَالِحًا، فَاجْعَلْ لَهُ جَنَّتَيْنِ ذَوَاتَيْ أَفْنَانٍ بِحَقِّ قَوْلِكَ: "وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ".
اللَّهُمَّ شَفِّعْ فِيهِ نَبِيَّنَا وَمُصْطَفَاكَ، وَاحْشُرْهُ تَحْتَ لِوَائِهِ، وَاسْقِهِ مِنْ يَدِهِ الشَّرِيفَةِ شَرْبَةً هَنِيئَةً لَا يَظْمَأُ بَعْدَهَا أَبَدًا.
اللَّهُمَّ اجْعَلْهُ فِي جَنَّةِ الْخُلْدِ "الَّتِي وُعِدَ الْمُتَّقُونَ كَانَتْ لَهُمْ جَزَاءً وَمَصِيرًا. لَهُمْ فِيهَا مَا يَشَاءُونَ خَالِدِينَ كَانَ عَلَى رَبِّكَ وَعْدًا مَسْؤُولًا".
اللَّهُمَّ إِنَّهُ صَبَرَ عَلَى الْبَلَاءِ فَلَمْ يَجْزَعْ، فَامْنَحْهُ دَرَجَةَ الصَّابِرِينَ الَّذِينَ يُوَفَّوْنَ أُجُورَهُمْ بِغَيْرِ حِسَابٍ فَإِنَّكَ الْقَائِلُ "إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُمْ بِغَيْرِ حِسَابٍ".
اللَّهُمَّ إِنَّهُ كَانَ مُصَلِّيًا لَكَ، فَثَبِّتْهُ عَلَى الصِّرَاطِ يَوْمَ تَزِلُّ الْأَقْدَامُ.
اللَّهُمَّ إِنَّهُ كَانَ صَائِمًا لَكَ، فَأَدْخِلْهُ الْجَنَّةَ مِنْ بَابِ الرَّيَّانِ.
اللَّهُمَّ إِنَّهُ كَانَ لِكِتَابِكَ تَالِيًا وَسَامِعًا، فَشَفِّعْ فِيهِ الْقُرْآنَ، وَارْحَمْهُ مِنَ النِّيرَانِ، وَاجْعَلْهُ يَا رَحْمَنُ يَرْتَقِي فِي الْجَنَّةِ إِلَى آخِرِ آيَةٍ قَرَأَهَا أَوْ سَمِعَهَا، وَآخِرِ حَرْفٍ تَلَاهُ.
اللَّهُمَّ ارْزُقْهُ بِكُلِّ حَرْفٍ فِي الْقُرْآنِ حَلَاوَةً، وَبِكُلِّ كَلِمَةٍ كَرَامَةً، وَبِكُلِّ آيَةٍ سَعَادَةً، وَبِكُلِّ سُورَةٍ سَلَامَةً، وَبِكُلِّ جُزْءٍ جَزَاءً.
اللَّهُمَّ ارْحَمْهُ فَإِنَّهُ كَانَ مُسْلِمًا، وَاغْفِرْ لَهُ فَإِنَّهُ كَانَ مُؤْمِنًا، وَأَدْخِلْهُ الْجَنَّةَ فَإِنَّهُ كَانَ بِنَبِيِّكَ مُصَدِّقًا، وَسَامِحْهُ فَإِنَّهُ كَانَ لِكِتَابِكَ مُرَتِّلًا.
اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا.
اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الْإِسْلَامِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الْإِيمَانِ.
اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ وَلَا تُضْلِلْنَا بَعْدَهُ.
اللَّهُمَّ ارْحَمْنَا إِذَا أَتَانَا الْيَقِينُ، وَعَرِقَ مِنَّا الْجَبِينُ، وَكَثُرَ الْأَنِينُ وَالْحَنِينُ.
اللَّهُمَّ ارْحَمْنَا إِذَا يَئِسَ مِنَّا الطَّبِيبُ، وَبَكَى عَلَيْنَا الْحَبِيبُ، وَتَخَلَّى عَنَّا الْقَرِيبُ وَالْغَرِيبُ، وَارْتَفَعَ النَّشِيجُ وَالنَّحِيبُ.
اللَّهُمَّ ارْحَمْنَا إِذَا اشْتَدَّتِ الْكُرُبَاتُ، وَتَوَالَتِ الْحَسَرَاتُ، وَأَطْبَقَتِ الرَّوْعَاتُ، وَفَاضَتِ الْعَبَرَاتُ، وَتَكَشَّفَتِ الْعَوْرَاتُ، وَتَعَطَّلَتِ الْقُوَى وَالْقُدُرَاتُ.
اللَّهُمَّ ارْحَمْنَا إِذَا حُمِلْنَا عَلَى الْأَعْنَاقِ، وَبَلَغَتِ التَّرَاقِيَ، وَقِيلَ مَنْ رَاقٍ وَظَنَّ أَنَّهُ الْفِرَاقُ وَالْتَفَّتِ السَّاقُ بِالسَّاقِ، إِلَيْكَ يَا رَبَّنَا يَوْمَئِذٍ الْمَسَاقُ.
اللَّهُمَّ ارْحَمْنَا إِذَا وُورِينَا التُّرَابَ، وَغُلِّقَتِ الْقُبُورُ وَالْأَبْوَابُ، وَانْفَضَّ الْأَهْلُ وَالْأَحْبَابُ، فَإِذَا الْوَحْشَةُ وَالْوَحْدَةُ وَهَوْلُ الْحِسَابِ.
اللَّهُمَّ ارْحَمْنَا إِذَا فَارَقْنَا النَّعِيمَ، وَانْقَطَعَ النَّسِيمُ، وَقِيلَ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ.
اللَّهُمَّ ارْحَمْنَا إِذَا أُقِمْنَا لِلسُّؤَالِ، وَخَانَنَا الْمَقَالُ، وَلَمْ يَنْفَعْ جَاهٌ وَلَا مَالٌ وَلَا عِيَالٌ، وَقَدْ حَالَ الْحَالُ، وَلَيْسَ إِلَّا فَضْلُ الْكَبِيرِ الْمُتَعَالِ.
اللَّهُمَّ ارْحَمْنَا إِذَا نُسِيَ اسْمُنَا، وَدَرَسَ رَسْمُنَا، وَأَحَاطَ بِنَا قِسْمُنَا وَوُسْعُنَا.
اللَّهُمَّ ارْحَمْنَا إِذَا أُهْمِلْنَا فَلَمْ يَزُرْنَا زَائِرٌ، وَلَمْ يَذْكُرْنَا ذَاكِرٌ، وَمَا لَنَا مِنْ قُوَّةٍ وَلَا نَاصِرٍ، فَلَا أَمَلَ إِلَّا فِي الْقَاهِرِ الْقَادِرِ الْغَافِرِ، يَا مَنْ إِذَا وَعَدَ أَوْفَى، وَإِذَا تَوَعَّدَ عَفَا، وَشَفِّعْ يَا رَبِّ فِينَا حَبِيبَنَا الْمُصْطَفَى، وَاجْعَلْنَا مِمَّنْ صَفَا وَوَفَى، وَبِاللَّهِ اكْتَفَى، يَا أَرْحَمَ الرَّاحِمِينَ، يَا حَيُّ يَا قَيُّومُ، يَا بَدِيعَ السَّمَاوَاتِ وَالْأَرْضِ، يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.
اللَّهُمَّ إِنَّهُ عَبْدُكَ وَابْنُ عَبْدِكَ وَابْنُ أَمَتِكَ مَاتَ وَهُوَ يَشْهَدُ لَكَ بِالْوَحْدَانِيَّةِ وَلِرَسُولِكَ بِالشَّهَادَةِ فَاغْفِرْ لَهُ إِنَّكَ أَنْتَ الْغَفَّارُ.
اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُ، وَلَا تَفْتِنَّا بَعْدَهُ، وَاغْفِرْ لَنَا وَلَهُ، وَاجْمَعْنَا مَعَهُ فِي جَنَّاتِ النَّعِيمِ يَا رَبَّ الْعَالَمِينَ.
اللَّهُمَّ أَنْزِلْ عَلَى أَهْلِهِ الصَّبْرَ وَالسُّلْوَانَ وَأَرْضِهِمْ بِقَضَائِكَ.
اللَّهُمَّ ثَبِّتْنَا عَلَى الْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا، وَفِي الْآخِرَةِ، وَيَوْمَ يَقُومُ الْأَشْهَادُ.
اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ إِلَى يَوْمِ الدِّينِ.`,c:1,h:"أَدْعِيَةٌ لِلْمُتَوَفَّى (ذُكُورٌ)",s:"أدعية عامة",f:"gen",w:"أدعية عامة جمعها الموقع — بعضها مأثور وأكثرها غير مأثور بلفظه"},{t:`اللَّهُمَّ أَبْدِلْهَا دَارًا خَيْرًا مِنْ دَارِهَا، وَأَهْلًا خَيْرًا مِنْ أَهْلِهَا، وَأَدْخِلْهَا الْجَنَّةَ، وَأَعِذْهَا مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ.
اللَّهُمَّ عَامِلْهَا بِمَا أَنْتَ أَهْلُهُ، وَلَا تُعَامِلْهَا بِمَا هِيَ أَهْلُهُ.
اللَّهُمَّ اجْزِهَا عَنِ الْإِحْسَانِ إِحْسَانًا وَعَنِ الْإِسَاءَةِ عَفْوًا وَغُفْرَانًا.
اللَّهُمَّ إِنْ كَانَتْ مُحْسِنَةً فَزِدْ مِنْ حَسَنَاتِهَا، وَإِنْ كَانَتْ مُسِيئَةً فَتَجَاوَزْ عَنْ سَيِّئَاتِهَا.
اللَّهُمَّ أَدْخِلْهَا الْجَنَّةَ مِنْ غَيْرِ مُنَاقَشَةِ حِسَابٍ وَلَا سَابِقَةِ عَذَابٍ.
اللَّهُمَّ آنِسْهَا فِي وَحْدَتِهَا وَفِي وَحْشَتِهَا وَفِي غُرْبَتِهَا.
اللَّهُمَّ أَنْزِلْهَا مُنْزَلًا مُبَارَكًا وَأَنْتَ خَيْرُ الْمُنْزِلِينَ.
اللَّهُمَّ أَنْزِلْهَا مَنَازِلَ الصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ، وَحَسُنَ أُولَئِكَ رَفِيقًا.
اللَّهُمَّ اجْعَلْ قَبْرَهَا رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ.
اللَّهُمَّ افْسَحْ لَهَا فِي قَبْرِهَا مَدَّ بَصَرِهَا، وَافْرُشْ قَبْرَهَا مِنْ فِرَاشِ الْجَنَّةِ.
اللَّهُمَّ أَعِذْهَا مِنْ عَذَابِ الْقَبْرِ، وَجَفَافِ الْأَرْضِ عَنْ جَنْبَيْهَا.
اللَّهُمَّ امْلَأْ قَبْرَهَا بِالرِّضَا وَالنُّورِ وَالْفُسْحَةِ وَالسُّرُورِ.
اللَّهُمَّ إِنَّهَا فِي ذِمَّتِكَ وَحَبْلِ جِوَارِكَ، فَقِهَا فِتْنَةَ الْقَبْرِ، وَعَذَابَ النَّارِ، وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ، فَاغْفِرْ لَهَا وَارْحَمْهَا إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ إِنَّهَا أَمَتُكَ وَبِنْتُ أَمَتِكَ خَرَجَتْ مِنَ الدُّنْيَا وَسَعَتِهَا وَمَحْبُوبِيهَا وَأَحِبَّائِهَا فِيهَا إِلَى ظُلْمَةِ الْقَبْرِ وَمَا هِيَ لَاقِيَتُهُ.
اللَّهُمَّ إِنَّهَا كَانَتْ تَشْهَدُ أَنَّكَ لَا إِلَهَ إِلَّا أَنْتَ وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ وَأَنْتَ أَعْلَمُ بِهَا.
اللَّهُمَّ إِنَّا نَتَوَسَّلُ بِكَ إِلَيْكَ، وَنُقْسِمُ بِكَ عَلَيْكَ أَنْ تَرْحَمَهَا وَلَا تُعَذِّبَهَا، وَأَنْ تُثَبِّتَهَا عِنْدَ السُّؤَالِ.
اللَّهُمَّ إِنَّهَا نَزَلَتْ بِكَ وَأَنْتَ خَيْرُ مَنْزُولٍ بِهِ، وَأَصْبَحَتْ فَقِيرَةً إِلَى رَحْمَتِكَ وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهَا.
اللَّهُمَّ آتِهَا بِرَحْمَتِكَ وَرِضَاكَ، وَقِهَا فِتْنَةَ الْقَبْرِ وَعَذَابَهُ، وَآتِهَا بِرَحْمَتِكَ الْأَمْنَ مِنْ عَذَابِكَ حَتَّى تَبْعَثَهَا إِلَى جَنَّتِكَ يَا أَرْحَمَ الرَّاحِمِينَ.
اللَّهُمَّ انْقُلْهَا مِنْ مَوَاطِنِ الدُّودِ وَضِيقِ اللُّحُودِ إِلَى جَنَّاتِ الْخُلُودِ.
اللَّهُمَّ احْمِهَا تَحْتَ الْأَرْضِ، وَاسْتُرْهَا يَوْمَ الْعَرْضِ، وَلَا تُخْزِهَا يَوْمَ يُبْعَثُونَ “يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ”.
اللَّهُمَّ يَمِّنْ كِتَابَهَا، وَيَسِّرْ حِسَابَهَا، وَثَقِّلْ بِالْحَسَنَاتِ مِيزَانَهَا، وَثَبِّتْ عَلَى الصِّرَاطِ أَقْدَامَهَا، وَأَسْكِنْهَا فِي أَعْلَى الْجَنَّاتِ بِجِوَارِ حَبِيبِكَ وَمُصْطَفَاكَ (صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ).
اللَّهُمَّ أَمِّنْهَا مِنْ فَزَعِ يَوْمِ الْقِيَامَةِ، وَمِنْ هَوْلِ يَوْمِ الْقِيَامَةِ، وَاجْعَلْ نَفْسَهَا آمِنَةً مُطْمَئِنَّةً، وَلَقِّنْهَا حُجَّتَهَا.
اللَّهُمَّ اجْعَلْهَا فِي بَطْنِ الْقَبْرِ مُطْمَئِنَّةً وَعِنْدَ قِيَامِ الْأَشْهَادِ آمِنَةً، وَبِجُودِ رِضْوَانِكَ وَاثِقَةً، وَإِلَى أَعْلَى دَرَجَاتِكَ سَابِقَةً.
اللَّهُمَّ اجْعَلْ عَنْ يَمِينِهَا نُورًا حَتَّى تَبْعَثَهَا آمِنَةً مُطْمَئِنَّةً فِي نُورٍ مِنْ نُورِكَ.
اللَّهُمَّ انْظُرْ إِلَيْهَا نَظْرَةَ رِضًا، فَإِنَّ مَنْ تَنْظُرُ إِلَيْهِ نَظْرَةَ رِضًا لَا تُعَذِّبُهُ أَبَدًا.
اللَّهُمَّ أَسْكِنْهَا فَسِيحَ الْجِنَانِ، وَاغْفِرْ لَهَا يَا رَحْمَنُ، وَارْحَمْهَا يَا رَحِيمُ، وَتَجَاوَزْ عَمَّا تَعْلَمُ يَا عَلِيمُ.
اللَّهُمَّ اعْفُ عَنْهَا فَإِنَّكَ الْقَائِلُ “وَيَعْفُو عَنْ كَثِيرٍ”.
اللَّهُمَّ إِنَّهَا جَاءَتْ بِبَابِكَ، وَأَنَاخَتْ بِجَنَابِكَ، فَجُدْ عَلَيْهَا بِعَفْوِكَ وَإِكْرَامِكَ وَجُودِ إِحْسَانِكَ.
اللَّهُمَّ إِنَّ رَحْمَتَكَ وَسِعَتْ كُلَّ شَيْءٍ فَارْحَمْهَا رَحْمَةً تَطْمَئِنُّ بِهَا نَفْسُهَا، وَتَقَرُّ بِهَا عَيْنُهَا.
اللَّهُمَّ احْشُرْهَا مَعَ الْمُتَّقِينَ إِلَى الرَّحْمَنِ وَفْدًا.
اللَّهُمَّ احْشُرْهَا مَعَ أَصْحَابِ الْيَمِينِ، وَاجْعَلْ تَحِيَّتَهَا سَلَامٌ لَكَ مِنْ أَصْحَابِ الْيَمِينِ.
اللَّهُمَّ بَشِّرْهَا بِقَوْلِكَ “كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّامِ الْخَالِيَةِ”
اللَّهُمَّ اجْعَلْهَا مِنَ الَّذِينَ سُعِدُوا فِي الْجَنَّةِ خَالِدِينَ فِيهَا مَا دَامَتِ السَّمَاوَاتُ وَالْأَرْضُ.
اللَّهُمَّ لَا نُزَكِّيهَا عَلَيْكَ، وَلَكِنَّا نَحْسَبُهَا أَنَّهَا آمَنَتْ وَعَمِلَتْ صَالِحًا، فَاجْعَلْ لَهَا جَنَّتَيْنِ ذَوَاتَيْ أَفْنَانٍ بِحَقِّ قَوْلِكَ: “وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ”.
اللَّهُمَّ شَفِّعْ فِيهَا نَبِيَّنَا وَمُصْطَفَاكَ، وَاحْشُرْهَا تَحْتَ لِوَائِهِ، وَاسْقِهَا مِنْ يَدِهِ الشَّرِيفَةِ شَرْبَةً هَنِيئَةً لَا تَظْمَأُ بَعْدَهَا أَبَدًا.
اللَّهُمَّ اجْعَلْهَا فِي جَنَّةِ الْخُلْدِ "الَّتِي وُعِدَ الْمُتَّقُونَ كَانَتْ لَهُمْ جَزَاءً وَمَصِيرًا. لَهُمْ فِيهَا مَا يَشَاءُونَ خَالِدِينَ كَانَ عَلَى رَبِّكَ وَعْدًا مَسْؤُولًا".
اللَّهُمَّ إِنَّهَا صَبَرَتْ عَلَى الْبَلَاءِ فَلَمْ تَجْزَعْ، فَامْنَحْهَا دَرَجَةَ الصَّابِرِينَ الَّذِينَ يُوَفَّوْنَ أُجُورَهُمْ بِغَيْرِ حِسَابٍ فَإِنَّكَ الْقَائِلُ "إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُمْ بِغَيْرِ حِسَابٍ".
اللَّهُمَّ إِنَّهَا كَانَتْ تُصَلِّي لَكَ، فَثَبِّتْهَا عَلَى الصِّرَاطِ يَوْمَ تَزِلُّ الْأَقْدَامُ.
اللَّهُمَّ إِنَّهَا كَانَتْ صَائِمَةً لَكَ، فَأَدْخِلْهَا الْجَنَّةَ مِنْ بَابِ الرَّيَّانِ.
اللَّهُمَّ إِنَّهَا كَانَتْ لِكِتَابِكَ تَالِيَةً وَسَامِعَةً، فَشَفِّعْ فِيهَا الْقُرْآنَ، وَارْحَمْهَا مِنَ النِّيرَانِ، وَاجْعَلْهَا يَا رَحْمَنُ تَرْتَقِي فِي الْجَنَّةِ إِلَى آخِرِ آيَةٍ قَرَأَتْهَا أَوْ سَمِعَتْهَا، وَآخِرِ حَرْفٍ تَلَتْهُ.
اللَّهُمَّ ارْزُقْهَا بِكُلِّ حَرْفٍ فِي الْقُرْآنِ حَلَاوَةً، وَبِكُلِّ كَلِمَةٍ كَرَامَةً، وَبِكُلِّ آيَةٍ سَعَادَةً، وَبِكُلِّ سُورَةٍ سَلَامَةً، وَبِكُلِّ جُزْءٍ جَزَاءً.
اللَّهُمَّ ارْحَمْهَا فَإِنَّهَا كَانَتْ مُسْلِمَةً، وَاغْفِرْ لَهَا فَإِنَّهَا كَانَتْ مُؤْمِنَةً، وَأَدْخِلْهَا الْجَنَّةَ فَإِنَّهَا كَانَتْ بِنَبِيِّكَ مُصَدِّقَةً، وَسَامِحْهَا فَإِنَّهَا كَانَتْ لِكِتَابِكَ مُرَتِّلَةً.
اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبِيرِنَا، وَذَكَرِنَا وَأُنْثَانَا.
اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الْإِسْلَامِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الْإِيمَانِ.
اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهَا وَلَا تُضْلِلْنَا بَعْدَهَا.
اللَّهُمَّ ارْحَمْنَا إِذَا أَتَانَا الْيَقِينُ، وَعَرِقَ مِنَّا الْجَبِينُ، وَكَثُرَ الْأَنِينُ وَالْحَنِينُ.
اللَّهُمَّ ارْحَمْنَا إِذَا يَئِسَ مِنَّا الطَّبِيبُ، وَبَكَى عَلَيْنَا الْحَبِيبُ، وَتَخَلَّى عَنَّا الْقَرِيبُ وَالْغَرِيبُ، وَارْتَفَعَ النَّشِيجُ وَالنَّحِيبُ.
اللَّهُمَّ ارْحَمْنَا إِذَا اشْتَدَّتِ الْكُرُبَاتُ، وَتَوَالَتِ الْحَسَرَاتُ، وَأَطْبَقَتِ الرَّوْعَاتُ، وَفَاضَتِ الْعَبَرَاتُ، وَتَكَشَّفَتِ الْعَوْرَاتُ، وَتَعَطَّلَتِ الْقُوَى وَالْقُدُرَاتُ.
اللَّهُمَّ ارْحَمْنَا إِذَا حُمِلْنَا عَلَى الْأَعْنَاقِ، وَبَلَغَتِ التَّرَاقِيَ، وَقِيلَ مَنْ رَاقٍ وَظَنَّ أَنَّهُ الْفِرَاقُ وَالْتَفَّتِ السَّاقُ بِالسَّاقِ، إِلَيْكَ يَا رَبَّنَا يَوْمَئِذٍ الْمَسَاقُ.
اللَّهُمَّ ارْحَمْنَا إِذَا وُورِينَا التُّرَابَ، وَغُلِّقَتِ الْقُبُورُ وَالْأَبْوَابُ، وَانْفَضَّ الْأَهْلُ وَالْأَحْبَابُ، فَإِذَا الْوَحْشَةُ وَالْوَحْدَةُ وَهَوْلُ الْحِسَابِ.
اللَّهُمَّ ارْحَمْنَا إِذَا فَارَقْنَا النَّعِيمَ، وَانْقَطَعَ النَّسِيمُ، وَقِيلَ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ.
اللَّهُمَّ ارْحَمْنَا إِذَا أُقِمْنَا لِلسُّؤَالِ، وَخَانَنَا الْمَقَالُ، وَلَمْ يَنْفَعْ جَاهٌ وَلَا مَالٌ وَلَا عِيَالٌ، وَقَدْ حَالَ الْحَالُ، وَلَيْسَ إِلَّا فَضْلُ الْكَبِيرِ الْمُتَعَالِ.
اللَّهُمَّ ارْحَمْنَا إِذَا نُسِيَ اسْمُنَا، وَدَرَسَ رَسْمُنَا، وَأَحَاطَ بِنَا قِسْمُنَا وَوُسْعُنَا.
اللَّهُمَّ ارْحَمْنَا إِذَا أُهْمِلْنَا فَلَمْ يَزُرْنَا زَائِرٌ، وَلَمْ يَذْكُرْنَا ذَاكِرٌ، وَمَا لَنَا مِنْ قُوَّةٍ وَلَا نَاصِرٍ، فَلَا أَمَلَ إِلَّا فِي الْقَاهِرِ الْقَادِرِ الْغَافِرِ، يَا مَنْ إِذَا وَعَدَ أَوْفَى، وَإِذَا تَوَعَّدَ عَفَا، وَشَفِّعْ يَا رَبِّ فِينَا حَبِيبَنَا الْمُصْطَفَى، وَاجْعَلْنَا مِمَّنْ صَفَا وَوَفَى، وَبِاللَّهِ اكْتَفَى، يَا أَرْحَمَ الرَّاحِمِينَ، يَا حَيُّ يَا قَيُّومُ، يَا بَدِيعَ السَّمَاوَاتِ وَالْأَرْضِ، يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.
اللَّهُمَّ إِنَّهَا أَمَتُكَ بِنْتُ أَمَتِكَ مَاتَتْ وَهِيَ تَشْهَدُ لَكَ بِالْوَحْدَانِيَّةِ وَلِرَسُولِكَ بِالشَّهَادَةِ فَاغْفِرْ لَهَا إِنَّكَ أَنْتَ الْغَفَّارُ.
اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهَا، وَلَا تَفْتِنَّا بَعْدَهَا، وَاغْفِرْ لَنَا وَلَهَا، وَاجْمَعْنَا مَعَهَا فِي جَنَّاتِ النَّعِيمِ يَا رَبَّ الْعَالَمِينَ.
اللَّهُمَّ أَنْزِلْ عَلَى أَهْلِهَا الصَّبْرَ وَالسُّلْوَانَ وَأَرْضِهِمْ بِقَضَائِكَ.
اللَّهُمَّ ثَبِّتْنَا عَلَى الْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا، وَفِي الْآخِرَةِ، وَيَوْمَ يَقُومُ الْأَشْهَادُ.
اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ إِلَى يَوْمِ الدِّينِ.`,c:1,h:"أَدْعِيَةٌ لِلْمُتَوَفَّاةِ (إِنَاثٌ)",s:"أدعية عامة",f:"gen",w:"أدعية عامة جمعها الموقع — بعضها مأثور وأكثرها غير مأثور بلفظه"},{t:"اللَّهُمَّ اجْعَلْهُ فَرَطًا وَذُخْرًا لِوَالِدَيْهِ، وَشَفِيعًا مُجَابًا، اللَّهُمَّ ثَقِّلْ بِهِ مَوَازِينَهُمَا، وَأَعْظِمْ بِهِ أُجُورَهُمَا، وَأَلْحِقْهُ بِصَالِحِ الْـمُؤْمِنِينَ، وَاجْعَلْهُ فِي كَفَالَةِ إِبْرَاهِيمَ، وَقِهِ بِرَحْمَتِكَ عَذَابَ الْجَحِيمِ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، اللَّهُمَّ اغْفِرْ لِأَسْلَافِنَا، وَأَفْرَاطِنَا، وَمَنْ سَبَقَنَا بِالْإِيمَانِ.",c:1,h:"أَدْعِيَةٌ لِلْمَيِّتِ الطِّفْلِ الصَّغِيرِ (ذَكَرٍ أَوْ أُنْثَى)",s:"أدعية مأثورة عن بعض السلف",f:"gen",w:"ليست حديثًا مرفوعًا — نُقلت عن بعض السلف"},{t:"اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ ، وَأَكْرِمْ نُزُلَهُ ، وَوَسِّعْ مُدْخَلَهُ ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ ، وَأَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ ، وَزَوْجًا خَيْرًا مِنْ زَوْجِهِ ، وَأَدْخِلْهُ الْجَنَّةَ ، وَقِهِ فِتْنَةَ الْقَبْرِ وَعَذَابَ النَّارِ.",c:1,h:"الدُّعَاءُ لِلْمَيِّتِ فِي صَلَاةِ الْجَنَازَةِ",s:"رواه مسلم من حديث عوف بن مالك"}]},{k:"jawami",ar:"جوامع الدعاء",en:"Comprehensive duas",items:[{t:`اللَّهُمَّ يَا بَارِئَ الْبَرِيَّاتِ ، وَغَافِرَ الْخَطِيئَاتِ ، وَعَالِمَ الْخَفِيَّاتِ ، الْمُطَّلِعَ عَلَى الضَّمَائِرِ وَالنِّيَّاتِ ، يَا مَنْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا ، وَوَسِعَ كُلَّ شَيْءٍ رَحْمَةً ، وَقَهَرَ كُلَّ مَخْلُوقٍ عِزَّةً وَحُكْماً ، اغْفِرْ لِي ذُنُوبِي ، وَاسْتُرْ عُيُوبِيَ ، وَتَجَاوَزْ عَنْ سَيِّئَاتِيَ إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ يَا سَمِيعَ الدَّعَوَاتِ ، يَا مُقِيلَ الْعَثَرَاتِ ، يَا قَاضِيَ الْحَاجَاتِ ، يَا كَاشِفَ الْكَرُبَاتِ ، يَا رَفِيعَ الدَّرَجَاتِ ، وَيَا غَافِرَ الزَّلَّاتِ ، اغْفِرْ لِلْمُسْلِمِينَ وَالْمُسْلِمَاتِ ، وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ، الْأَحْيَاءِ مِنْهُمْ وَالْأَمْوَاتِ ، إِنَّكَ سَمِيعٌ قَرِيبٌ مُجِيبُ الدَّعَوَاتِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ الْأَعْظَمِ ، الَّذِي إِذَا دُعِيتَ بِهِ أَجَبْتَ ، وَإِذَا سُئِلْتَ بِهِ أَعْطَيْتَ ، أَسْأَلُكَ بِأَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ ، الْأَحَدُ الصَّمَدُ ، الَّذِي لَمْ يَلِدْ، وَلَمْ يُولَدْ ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ؛ أَنْ تَغْفِرَ لِي ذُنُوبِي ، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي.
اللَّهُمَّ رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَنْ دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي ، وَإِسْرَافِي فِي أَمْرِي ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي ، اللَّهُمَّ اغْفِرْ لِي هَزْلِي وَجِدِّي ، وَخَطَئِي وَعَمْدِي ، وَكُلُّ ذَلِكَ عِنْدِي.
اللَّهُمَّ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي.
اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.
اللَّهُمَّ اغْفِرْ لِي ، وَارْحَمْنِي وَاهْدِنِي ، وَعَافِنِي وَارْزُقْنِي ، وَاجْبُرْنِي ، وَارْفَعْنِي.
اللَّهُمَّ يَا مَنْ لَا تَضُرُّهُ الذُّنُوبُ ، وَلَا تُنْقِصُهُ الْمَغْفِرَةُ ، اغْفِرْ لَنَا مَا لَا يَضُرُّكَ ، وَهَبْ لَنَا مَا لَا يُنْقِصُكَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ ، دِقَّهُ وَجِلَّهُ ، وَأَوَّلَهُ وَآخِرَهُ ، وَعَلَانِيَتَهُ وَسِرَّهُ.
اللَّهُمَّ إِنَّ ذُنُوبِي عِظَامٌ وَهِيَ صِغَارٌ فِي جَنْبِ عَفْوِكَ يَا كَرِيمُ ، فَاغْفِرْهَا لِي.
اللَّهُمَّ اغْفِرْ لِي ذَنْبِي ، وَوَسِّعْ لِي فِي دَارِي ، وَبَارِكْ لِي فِي رِزْقِي.
اللَّهُمَّ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا ، رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا ، رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ، وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ.
اللَّهُمَّ إِنَّا قَدْ أَطَعْنَاكَ فِي أَحَبِّ الْأَشْيَاءِ إِلَيْكَ أَنْ تُطَاعَ فِيهِ ، الْإِيمَانِ بِكَ ، وَالْإِقْرَارِ بِكَ ، وَلَمْ نَعْصِكَ فِي أَبْغَضِ الْأَشْيَاءِ أَنْ تُعْصَى فِيهِ ؛ الْكُفْرِ وَالْجَحْدِ بِكَ ، اللَّهُمَّ فَاغْفِرْ لَنَا مَا بَيْنَهُمَا.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ ، وَمَا أَعْلَنْتُ وَمَا أَسْرَرْتُ ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي ، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ لَا إِلَهَ إِلَّا أَنْتَ.
اللَّهُمَّ رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ.
اللَّهُمَّ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ ، رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ وَقِهِمْ عَذَابَ الْجَحِيمِ.
اللَّهُمَّ أَقِلْ عَثَرَاتِنَا ، وَاغْفِرْ زَلَّاتِنَا ، وَكَفِّرْ عَنَّا سَيِّئَاتِنَا ، وَتَوَفَّنَا مَعَ الْأَبْرَارِ.
اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ ، اللَّهُمَّ نَقِّنِي مِنْ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا ، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ. فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدَكَ ، وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا اللَّهُ بِأَنَّكَ الْوَاحِدُ الْأَحَدُ ، الصَّمَدُ ، الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ ، أَنْ تَغْفِرَ لِي ذُنُوبِي ، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ إِلَهِي : حُجَّتِي حَاجَتِي ، وَعُدَّتِي فَاقَتِي ، فَارْحَمْنِي.
اللَّهُمَّ إِلَهِي : كَيْفَ أَمْتَنِعُ بِالذَّنْبِ مِنَ الدُّعَاءِ ، وَلَا أَرَاكَ تَمْنَعُ مَعَ الذَّنْبِ مِنَ الْعَطَاءِ ، فَإِنْ غَفَرْتَ فَخَيْرُ رَاحِمٍ أَنْتَ ، وَإِنْ عَذَّبْتَ فَغَيْرُ ظَالِمٍ أَنْتَ.
اللَّهُمَّ إِلَهِي: أَسْأَلُكَ تَذَلُّلاً فَأَعْطِنِي تَفَضُّلاً.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ يَا مَنْ عَلَى الْعَرْشِ اسْتَوَى ، يَا مَنْ خَلَقَ فَسَوَّى وَقَدَّرَ فَهَدَى ، وَأَعْطَى كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَى ، يَا مَنْ أَضْحَكَ وَأَبْكَى، وَأَمَاتَ وَأَحْيَا ، وَأَسْعَدَ وَأَشْقَى ، وَأَوْجَدَ وَأَبْلَى ، وَرَفَعَ وَخَفَضَ ، وَأَعَزَّ وَأَذَلَّ، وَأَعْطَى وَمَنَعَ ، وَرَفَعَ وَوَضَعَ.
اللَّهُمَّ يَا مَنْ شَقَّ الْبِحَارَ ، وَأَجْرَى الْأَنْهَارَ ، وَكَوَّرَ النَّهَارَ عَلَى اللَّيْلِ وَاللَّيْلَ عَلَى النَّهَارِ ، يَا مَنْ هَدَى مِنْ ضَلَالَةٍ ، وَأَنْقَذَ مِنْ جَهَالَةٍ ، وَأَنَارَ الْأَبْصَارَ ، وَأَحْيَا الضَّمَائِرَ وَالْأَفْكَارَ.
اللَّهُمَّ اهْدِنَا فِيمَنْ هَدَيْتَ ، وَعَافِنَا فِيمَنْ عَافَيْتَ ، وَتَوَلَّنَا فِيمَنْ تَوَلَّيْتَ.
اللَّهُمَّ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ، صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ مِنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ.
اللَّهُمَّ وَفِّقْنَا لِهُدَاكَ وَاجْعَلْ عَمَلَنَا فِي رِضَاكَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَرِنَا الْحَقَّ حَقًّا وَارْزُقْنَا اتِّبَاعَهُ، وَأَرِنَا الْبَاطِلَ بَاطِلاً وَارْزُقْنَا اجْتِنَابَهُ.
اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا ، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا.
اللَّهُمَّ رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.
اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا ، وَكَرِّهِ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ.
اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ خُذْ بِنَوَاصِينَا لِلْبِرِّ وَالتَّقْوَى ، وَلِمَا تُحِبُّ مِنَ الْعَمَلِ وَتَرْضَى.
اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ ، وَإِسْرَافِيلَ ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ ، اهْدِنَا لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ.
اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ ، نَاصِيَتِي بِيَدِكَ ، مَاضٍ فِيَّ حُكْمُكَ ، عَدْلٌ فِيَّ قَضَاؤُكَ ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ ، سَمَّيْتَ بِهِ نَفْسَكَ ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ ، أَوْ عَلَّمْتَهُ أَحَداً مِنْ خَلْقِكَ ، أَوْ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي ، وَنُورَ صَدْرِي ، وَجَلَاءَ حَزَنِي ، وَذَهَابَ هَمِّي.
اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً ، وَفِي سَمْعِي نُوراً ، وَفِي بَصَرِي نُوراً ، وَعَنْ يَمِينِي نُوراً ، وَعَنْ شِمَالِي نُوراً ، وَمِنْ بَيْنَ يَدَيَّ نُوراً ، وَمِنْ خَلْفِي نُوراً ، وَمِنْ فَوْقِي نُوراً ، وَمِنْ تَحْتِي نُوراً ، وَاجْعَلْ لِي نُوراً ، وَأَعْظِمْ لِي نُوراً.
اللَّهُمَّ أَغْنِنِي بِالْعِلْمِ ، وَزَيِّنِّي بِالْحِلْمِ ، وَأَكْرِمْنِي بِالتَّقْوَى ، وَجَمِّلْنِي بِالْعَافِيَةِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمَ الْخَائِفِينَ مِنْكَ ، وَخَوْفَ الْعَالِمِينَ بِكَ ، وَيَقِينَ الْمُتَوَكِّلِينَ عَلَيْكَ ، وَتَوَكُّلَ الْمُوقِنِينَ بِكَ ، وَإِنَابَةَ الْمُخْبِتِينَ إِلَيْكَ ، وَإِخْبَاتَ الْمُنِيبِينَ إِلَيْكَ ، وَشُكْرَ الصَّابِرِينَ لَكَ ، وَصَبْرَ الشَّاكِرِينَ لَكَ ، وَلَحَاقاً بِالْأَحْيَاءِ الْمَرْزُوقِينَ عِنْدَكَ.
اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالسَّدَادَ.
اللَّهُمَّ أَلْهِمْنِي رُشْدِي ، وَأَعِذْنِي مِنْ شَرِّ نَفْسِي.
اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي ، وَعَلِّمْنِي مَا يَنْفَعُنِي ، وَزِدْنِي عِلْماً.
اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً ، وَأَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ ثَبِّتْنِي وَاجْعَلْنِي هَادِياً مَهْدِيّاً.
اللَّهُمَّ لَكَ أَسْلَمْتُ ، وَبِكَ آمَنْتُ ، وَعَلَيْكَ تَوَكَّلْتُ ، وَإِلَيْكَ أَنَبْتُ ، وَبِكَ خَاصَمْتُ، أَعُوذُ بِعِزَّتِكَ ، لَا إِلَهَ إِلَّا أَنْتَ ، أَنْ تُضِلَّنِي ، أَنْتَ الْحَيُّ الَّذِي لَا يَمُوتُ ، وَالْجِنُّ وَالْإِنْسُ يَمُوتُونَ.
اللَّهُمَّ اهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ ، وَاصْرِفْ عَنِّي سَيِّئَهَا لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ.
اللَّهُمَّ كَمَا أَحْسَنْتَ خَلْقِي فَأَحْسِنْ خُلُقِي.
اللَّهُمَّ فَالِقَ الْحَبِّ وَالنَّوَى ، وَمُخْرِجَ الْحَيِّ مِنَ الْمَيِّتِ وَمُخْرِجَ الْمَيِّتِ مِنَ الْحَيِّ ، فَالِقَ الْإِصْبَاحِ ، وَجَاعِلَ اللَّيْلِ سَكَنًا ، وَالشَّمْسَ وَالْقَمَرَ حُسْبَاناً ، يَا مَنْ جَعَلَ لَنَا النُّجُومَ لِنَهْتَدِيَ بِهَا فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ جَلَّتْ قُدْرَتُكَ ، وَتَعَالَتْ حِكْمَتُكَ ، وَتَبَارَكَ اسْمُكَ ، وَتَعَالَى جَدُّكَ ، وَلَا إِلَهَ غَيْرُكَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ ، لَا إِلَهَ إِلَّا أَنْتَ ، الْمَنَّانُ ، بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ، ذُو الْجَلَالِ وَالْإِكْرَامِ ، يَا حَيُّ يَا قَيُّومُ.
اللَّهُمَّ ارْزُقْنَا رِزْقًا يَزِيدُنَا لَكَ شُكْراً ، وَإِلَيْكَ فَاقَةً وَفَقْراً ، وَبِكَ عَمَّنْ سِوَاكَ غِنًى.
اللَّهُمَّ اجْعَلْ أَوْسَعَ رِزْقِكَ عَلَيَّ عِنْدَ كِبَرِ سِنِّي ، وَانْقِطَاعِ عُمُرِي.
اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ فَإِنَّهُ لَا يَمْلِكُهَا إِلَّا أَنْتَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ رَبِّ لَا تَذَرْنِي فَرْداً وَأَنْتَ خَيْرُ الْوَارِثِينَ.
اللَّهُمَّ رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ.
اللَّهُمَّ قَنِّعْنِي بِمَا رَزَقْتَنِي ، وَبَارِكْ لِي فِيهِ ، وَاخْلُفْ عَلَيَّ كُلَّ غَائِبَةٍ لِي مِنْكَ بِخَيْرٍ.
اللَّهُمَّ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَاماً.
اللَّهُمَّ يَا مَنْ تُسَبِّحُ لَهُ السَّمَاوَاتُ بِنُجُومِهَا وَأَبْرَاجِهَا ، وَالْأَرْضُ بِسُهُولِهَا وَفِجَاجِهَا ، وَالْبِحَارُ بِأَحْيَائِهَا وَأَمْوَاجِهَا ، وَالْجِبَالُ بِقِمَمِهَا وَأَوْتَادِهَا ، وَالْأَشْجَارُ بِفُرُوعِهَا وَثِمَارِهَا ، وَالسِّبَاعُ فِي فَلَوَاتِهَا ، وَالطَّيْرُ فِي وَكَنَاتِهَا ، يَا مَنْ تُسَبِّحُ لَهُ الذَّرَّاتُ عَلَى صِغَرِهَا ، وَالْمَجَرَّاتُ عَلَى كِبَرِهَا ، يَا مَنْ تُسَبِّحُ لَهُ السَّمَاوَاتُ السَّبْعُ وَالْأَرْضُ وَمَنْ فِيهِنَّ ، وَإِنْ مِنْ شَيْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ يَا مَنْ خَلَقَ الْأَرْضَ وَالسَّمَاوَاتِ الْعُلَى ، يَا رَحْمَاناً عَلَى الْعَرْشِ اسْتَوَى ، يَا مَنْ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَمَا بَيْنَهُمَا ، وَمَا تَحْتَ الثَّرَى ، يَا مَنْ يَعْلَمُ السِّرَ وَأَخْفَى، يَا مَنْ لَهُ الْأَسْمَاءُ الْحُسْنَى ، يَا مَنْ مَعَ عِبَادِهِ يَسْمَعُ وَيَرَى ، يَا مَنْ أَعْطَى كُلَّ شَيْءٍ خَلْقَهُ ثُمَّ هَدَى.
اللَّهُمَّ أَنْتَ الْبَادِئُ بِالْإِحْسَانِ مِنْ قَبْلِ تَوَجُّهِ الْعَابِدِينَ ، وَأَنْتَ الْبَادِئُ بِالْعَطَايَا قَبْلَ طَلَبِ الطَّالِبِينَ وَأَنْتَ الْوَهَّابُ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ وَعَمَلٍ ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ وَعَمَلٍ.
اللَّهُمَّ رَبِّ ابْنِ لِي عِنْدَكَ بَيْتاً فِي الْجَنَّةِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ رِضَاكَ وَالْجَنَّةَ ، وَأَعُوذُ بِكَ مِنْ سَخَطِكَ وَالنَّارِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا ، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الْآخِرَةِ.
اللَّهُمَّ رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَاماً.
اللَّهُمَّ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ ، وَأَسْتَجِيرُ بِكَ مِنَ النَّارِ.
اللَّهُمَّ رَبَّنَا وَآتِنَا مَا وَعَدْتَنَا عَلَى رُسِلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ حَاسِبْنِي حِسَاباً يَسِيراً.
اللَّهُمَّ إِنَّا نَعُوذُ بِكَ أَنْ نُشْرِكَ بِكَ شَيْئاً نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَهْدِ الْبَلَاءِ ، وَدَرَكِ الشَّقَاءِ ، وَسُوءِ الْقَضَاءِ ، وَشَمَاتَةِ الْأَعْدَاءِ ، يَا سَمِيعَ الدُّعَاءِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ ، وَمِنْ عَذَابِ الْقَبْرِ ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ ، وَمِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ ، وَأَعُوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ ، وَفِتْنَةِ الْقَبْرِ ، وَعَذَابِ الْقَبْرِ ، وَشَرِّ فِتْنَةِ الْغِنَى ، وَشَرِّ فِتْنَةِ الْفَقْرِ ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ اغْسِلْ قَلْبِي بِمَاءِ الثَّلْجِ وَالْبَرَدِ ، وَنَقِّ قَلْبِيَ مِنْ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ ، وَبَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْمَأْثَمِ وَالْمَغْرَمِ.
اللَّهُمَّ رَبَّ جِبْرَائِيلَ ، وَمِيكَائِيلَ ، وَرَبَّ إِسْرَافِيلَ ، أَعُوذُ بِكَ مِنْ حَرِّ النَّارِ وَمِنْ عَذَابِ الْقَبْرِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامَةِ ، فَإِنَّ جَارَ الْبَادِيَةِ يَتَحَوَّلُ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ ، وَالْجُبْنِ وَالْبُخْلِ ، وَالْهَرَمِ وَالْقَسْوَةِ ، وَالْغَفْلَةِ وَالْعَيْلَةِ وَالذِّلَّةِ ، وَالْمَسْكَنَةِ ، وَأَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْكُفْرِ ، وَالْفُسُوقِ وَالشِّقَاقِ وَالنِّفَاقِ، وَالسُّمْعَةِ وَالرِّيَاءِ ، وَأَعُوذُ بِكَ مِنَ الصَّمَمِ وَالْبَكَمِ ، وَالْجُنُونِ ، وَالْجِذَامِ ، وَالْبَرَصِ ، وَسَيِّئِ الْأَسْقَامِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ ، وَالْجُبْنِ ، وَالْبُخْلِ ، وَالْهَرَمِ ، وَعَذَابِ الْقَبْرِ، اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا ، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا ، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ ، وَمِنْ قَلْبٍ لَا يَخْشَعُ ، وَمِنْ نَفْسٍ لَا تَشْبَعُ ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ وَالْأَعْمَالِ وَالْأَهْوَاءِ وَالْأَدْوَاءِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ تُحَسِّنَ فِي لَوَائِحِ الْعُيُونِ عَلَانِيَتِي ، وَتُقَبِّحَ فِي خَفِيَّاتِ الْعُيُونِ سَرِيرَتِي ، اللَّهُمَّ كَمَا أَسَأْتُ وَأَحْسَنْتَ إِلَيَّ ، فَإِذَا عُدْتُ فَعُدْ عَلَيَّ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِي ، وَمِنْ شَرِّ بَصَرِي ، وَمِنْ شَرِّ لِسَانِي ، وَمِنْ شَرِّ قَلْبِي ، وَمِنْ شَرِّ مَنِيِّي.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَقُولَ زُوراً ، أَوْ أَغْشَى فُجُوراً ، أَوْ أَكُونَ بِكَ مَغْرُوراً.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الشِّقَاقِ وَالنِّفَاقِ ، وَسُوءِ الْأَخْلَاقِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ ، وَبِكَ مِنْكَ ، لَا أُحْصِي ثَنَاءً عَلَيْكَ ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.
اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَرَبَّ الْأَرْضِ ، وَرَبَّ الْعَرْشِ الْعَظِيمِ ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ ، فَالِقَ الْحَبِّ وَالنَّوَى ، وَمُنَزِّلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانَ ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ ، اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيءٌ ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيءٌ ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيءٌ ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ ، وَغَلَبَةِ الْعَدُوِّ ، وَشَمَاتَةِ الْأَعْدَاءِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَقْرِ وَالْقِلَّةِ وَالذِّلَّةِ ، وَأَعُوذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ فِتْنَةِ الْغِنَى ، وَمِنْ شَرِّ فِتْنَةِ الْفَقْرِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ ، وَتَحَوُّلِ عَافِيَتِكَ ، وَفُجَاءَةِ نِقْمَتِكَ ، وَجَمِيعِ سَخَطِكَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ يَوْمِ السُّوءِ ، وَمِنْ لَيْلَةِ السُّوءِ ، وَمِنْ سَاعَةِ السُّوءِ ، وَمِنْ صَاحِبِ السُّوءِ ، وَمِنْ جَارِ السُّوءِ ، فِي دَارِ الْمُقَامَةِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ قَلْبٍ لَا يَخْشَعُ ، وَمِنْ دُعَاءٍ لَا يُسْمَعُ ، وَمِنْ نَفْسٍ لَا تَشْبَعُ ، وَمِنْ عِلْمٍ لَا يَنْفَعُ ، أَعُوذُ بِكَ مِنْ هَؤُلَاءِ الْأَرْبَعِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ التَّرَدِّي ، وَالْهَدْمِ ، وَالْغَرَقِ ، وَالْحَرْقِ وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ ، وَأَعُوذُ بِكَ مِنْ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِراً ، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغاً.
اللَّهُمَّ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ، وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ الْأَشْرَارِ ، وَمِنْ كَيْدِ الْفُجَّارِ ، ومِنْ طَوَارِقِ اللَّيْلِ وَالنَّهَارِ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ.
اللَّهُمَّ رَبِّ أَعُوذُ بِكَ مِنْ أَعْيُنِ الْعَائِنِينَ ، وَمِنْ سِحْرِ السَّاحِرِينَ ، وَمِنْ شَرِّ كُلِّ ذِي شَرٍّ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ ، فَإِنَّهُ بِئْسَ الضَّجِيعُ ، وَأَعُوذُ بِكَ مِنْ الْخِيَانَةِ ، فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عُقُوقِ الْأَبْنَاءِ ، وَمِنْ قَطِيعَةِ الْأَقْرِبَاءِ ، وَمِنْ جَفْوَةِ الْأَحْيَاءِ ، وَمِنْ تَغَيُّرِ الْأَصْدِقَاءِ ، وَمِنْ شَمَاتَةِ الْأَعْدَاءِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ أَنْ أَزِلَّ أَوْ أُزَلَّ ، أَوْ أَضِلَّ أَوْ أُضَلَّ ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.
اللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَهْدِيكَ، وَنَسْتَغْفِرُكَ وَنَتُوبُ إِلَيْكَ وَنُؤْمِنُ بِكَ ، وَنَتَوَكَّلُ عَلَيْكَ ، وَنُثْنِي عَلَيْكَ الْخَيْرَ كُلَّهُ ، نَشْكُرُكَ وَلَا نَكْفُرُكَ ، وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ ، اللَّهُمَّ إِيَّاكَ نَعْبُدُ ، وَلَكَ نُصَلِّي وَنَسْجُدُ ، وَإِلَيكَ نَسْعَى وَنَحْفِدُ ، نَرْجُو رَحْمَتَكَ ، وَنَخْشَى عَذَابَكَ ، إِنَّ عَذَابَكَ الْجِدَّ بِالْكُفَّارِ مُلْحِقٌ.
اللَّهُمَّ رَبَّنَا أَعِزَّنَا بِالْإِسْلَامِ ، وَأَعِزَّ بِنَا الْإِسْلَامَ ، اللَّهُمَّ أَعْلِ بِنَا كَلِمَةَ الْإِسْلَامِ ، وَارْفَعْ بِنَا رَايَةَ الْقُرْآنِ.
اللَّهُمَّ مُنْزِلَ الْكِتَابِ ، وَمُجْرِيَ السَّحَابِ وَهَازِمَ الْأَحْزَابِ ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ أَسْأَلُكَ بِاسْمِكَ الْأَعْظَمِ الَّذِي إِذَا دُعِيتَ بِهِ أَجَبْتَ وَإِذَا سُئِلْتَ بِهِ أَعْطَيْتَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ يَا حَيُّ يَا قَيُّومُ ، يَا حَيُّ يَا قَيُّومُ ، يَا حَيُّ يَا قَيُّومُ ، اللَّهُمَّ أَظِلَّنِي فِي ظِلِّ عَرْشِكَ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّكَ.
اللَّهُمَّ أَظْهِرْ دِينَكَ عَلَى الدِّينِ كُلِّهُ وَلَوْ كَرِهَ الْمُشْرِكُونَ.
اللَّهُمَّ يَا مَنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ ، وَيَكْشِفُ السُّوءَ ، اكْشِفِ السُّوءَ عَنْ إِخْوَانِنَا الْأُسَارَى وَالْمَسْجُونِينَ وَالْمُعْتَقَلِينَ ، اللَّهُمَّ افْكُكْ بِقُوَّتِكَ أَسْرَهُمْ ، وَاجْبُرْ بِرَحْمَتِكَ كَسْرَهُمْ ، وَتَوَلَّ بِعِنَايَتِكَ أَمْرَهُمْ ، وَرُدَّهُمْ إِلَى أَهْلِيهِمْ سَالِمِينَ غَانِمِينَ.
اللَّهُمَّ كُنْ لِلْمُسْلِمِينَ وَالْمُسْتَضْعَفِينَ فِي كُلِّ مَكَانٍ ؛ فَرِّجْ هَمَّهُمْ ، وَنَفِّسْ كَرْبَهُمْ ، وَأَقِلْ عَثْرَتَهُمْ وَتَوَلَّ بِنَفْسِكَ أَمْرَهُمْ.
اللَّهُمَّ ارْفَعْ رَايَتَهُمْ ، وَاكْبِتْ عَدُوَّهُمْ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ وَحِّدْ صَفَّهُمْ ، وَاجْمَعْ كَلِمَتَهُمْ ، وَرُدَّهُمْ إِلَيْكَ رَدَّاً جَمِيلاً.
اللَّهُمَّ لَا أَبَرَّ بِهِمْ مِنْكَ ، وَلَا أَرْحَمَ بِهِمْ مِنْكَ، وَلَا أَرْأَفَ بِهِمْ مِنْكَ.. اللَّهُمَّ هُمْ مِنْكَ وَإِلَيكَ.. اللَّهُمَّ فَاجْعَلِ الدَّائِرَةَ لَهُمْ لَا عَلَيْهِمْ وَالنَّصْرَ حَلِيفَهُمْ.. يَا رَبِّ.
اللَّهُمَّ يَا خَيْرَ مَنْ سُئِلَ ، وَأَجْوَدَ مَنْ أَعْطَى ، وَأَكْرَمَ مَنْ عَفَا ، وَأَعْظَمَ مَنْ غَفَرَ ، وَأَعْدَلَ مَنْ حَكَمَ ، وَأَصْدَقَ مَنْ حَدَّثَ ، وَأَوْفَى مَنْ وَعَدَ ، وَأَبْصَرَ مَنْ رَاقَبَ ، وَأَسْرَعَ مَنْ حَاسَبَ ، وَأَرْحَمَ مَنْ عَاقَبَ ، وَأَحْسَنَ مَنْ خَلَقَ ، وَأَحْكَمَ مَنْ شَرَعَ ، وَأَحَقَّ مَنْ عُبِدَ ، وَأَوْلَى مَنْ دُعِيَ ، وَأَبَرَّ مَنْ أَجَابَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَسْأَلَةِ ، وَخَيْرَ الدُّعَاءِ ، وَخَيْرَ النَّجَاحِ ، وَخَيْرَ الْعَمَلِ ، وَخَيْرَ الثَّوَابِ ، وَخَيْرَ الْحَيَاةِ ، وَخَيْرَ الْمَمَاتِ ، وَثَبِّتْنِي ، وَثَقِّلْ مَوَازِينِي ، وَحَقِّقْ إِيمَانِي ، وَارْفَعْ دَرَجَاتِي ، وَتَقَبَّلْ صَلَاتِي ، وَاغْفِرْ خَطِيئَتِي ، وَأَسْأَلُكَ الدَّرَجَاتِ الْعُلَى مِنَ الْجَنَّةِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ فَوَاتِحَ الْخَيْرِ ، وَخَوَاتِمَهُ ، وَجَوَامِعَهُ ، وَأَوَّلَهُ ، وَظَاهِرَهُ ، وَبَاطِنَهُ ، وَالدَّرَجَاتِ الْعُلَى مِنَ الْجَنَّةِ آمِينَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ مَا آتِي ، وَخَيْرَ مَا أَفْعَلُ ، وَخَيْرَ مَا أَعْمَلُ ، وَخَيْرَ مَا بَطَنَ ، وَخَيْرَ مَا ظَهَرَ ، وَالدَّرَجَاتِ الْعُلَى مِنَ الْجَنَّةِ آمِينَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ أَنْ تَرْفَعَ ذِكْرِي ، وَتَضَعَ وِزْرِيَ ، وَتُصْلِحَ أَمْرِيَ ، وَتُطَهِّرَ قَلْبِيَ ، وَتُحَصِّنَ فَرْجِيَ ، وَتُنَوِّرَ قَلْبِيَ ، وَتَغْفِرَ لِي ذَنْبِيَ ، وَأَسْأَلُكَ الدَّرَجَاتِ الْعُلَى مِنَ الْجَنَّةِ آمِينَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ أَنْ تُبَارِكَ فِي نَفْسِي ، وَفِي سَمْعِي ، وَفِي بَصَرِي ، وَفِي رُوحِي ، وَفِي خَلْقِي ، وَفِي خُلُقِي ، وَفِي أَهْلِي ، وَفِي مَحْيَايَ ، وَفِي مَمَاتِي ، وَفِي عَمَلِي ، فَتَقَبَّلْ حَسَنَاتِي ، وَأَسْأَلُكَ الدَّرَجَاتِ الْعُلَى مِنَ الْجَنَّةِ آمِينَ.
اللَّهُمَّ لَكَ الْحَمْدُ كُلُّهُ ، اللَّهُمَّ لَا قَابِضَ لِمَا بَسَطْتَ ، وَلَا بَاسِطَ لِمَا قَبَضْتَ ، وَلَا هَادِيَ لِمَنْ أَضْلَلْتَ وَلَا مُضِلَّ لِمَنْ هَدَيْتَ ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا مَانِعَ لِمَا أَعْطَيْتَ ، وَلَا مُقَرِّبَ رَبِّ لِمَا بَاعَدْتَ ، وَلَا مُبَاعِدَ لِمَا قَرَّبْتَ ، اللَّهُمَّ ابْسُطْ عَلَيْنَا مِنْ بَرَكَاتِكَ وَرَحْمَتِكَ وَفَضْلِكَ وَرِزْقِكَ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ الْمُقِيمَ الَّذِي لَا يَحُولُ وَلَا يَزُولُ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ يَوْمَ الْعَيْلَةِ وَالْأَمْنِ يَوْمَ الْخَوْفِ ، اللَّهُمَّ إِنِّي عَائِذٌ بِكَ مِنْ شَرِّ مَا أَعْطَيْتَنَا وَشَرِّ مَا مَنَعْتَنَا.
اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ ، اللَّهُمَّ تَوَفَّنَا مُسْلِمِينَ ، وَأَحْيِنَا مُسْلِمِينَ ، وَأَلْحِقْنَا بِالصَّالِحِينَ غَيْرَ خَزَايَا وَلَا مَفْتُونِينَ ، اللَّهُمَّ قَاتِلِ الْكَفَرَةَ الَّذِينَ يُكَذِّبُونَ رُسُلَكَ ، وَيَصُدُّونَ عَنْ سَبِيلِكَ ، وَاجْعَلْ عَلَيْهِمْ رِجْزَكَ وَعَذَابَكَ ، اللَّهُمَّ قَاتِلِ الْكَفَرَةَ الَّذِينَ أُوتُوا الْكِتَابَ ، إِلَهَ الْحَقِّ.. آمِينَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ بِعِلْمِكَ الْغَيْبَ ، وَقُدْرَتِكَ عَلَى الْخَلْقِ ؛ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي ، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ ، وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ ، وَأَسْأَلُكَ نَعِيماً لَا يَنْفَدُ ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطُعُ ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ ، وَالشَّوْقَ إِلَى لِقَائِكَ ، فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ وَلَا فِتْنَةٍ مُضِلَّةٍ ، اللَّهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ ، وَتَرْكَ الْمُنْكَرَاتِ ، وَحُبَّ الْمَسَاكِينَ ، وَأَنْ تَغْفِرَ لِي وَتَرْحَمَنِي ، وَإِذَا أَرَدْتَ فِتْنَةَ قَومٍ فَتَوَفَّنِي غَيْرَ مَفْتُونٍ ، وَأَسْأَلُكَ حُبَّكَ ، وَحُبَّ مَنْ يُحِبُّكَ ، وَحُبَّ كُلِّ عَمَلٍ يُقَرِّبُنِي إِلَى حُبِّكَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهُ ؛ عَاجِلِهِ وَآجِلِهِ ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ ، وَأَعُوذُ بِكَ مِنْ الشَّرِّ كُلِّهُ عَاجِلِهِ وَآجِلِهِ ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَنَبِيُّكَ مُحَمَّدٌ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ بِكَ مِنْهُ عَبْدُكَ وَنَبِيُّكَ مُحَمَّدٌ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ ، وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ ، وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِي خَيْرًا.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا تَحُولُ بِهِ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ ، وَمِنْ طَاعَتِكَ مَا تُبَلِّغُنَا بِهِ جَنَّتَكَ ، وَمِنَ الْيَقِينِ مَا تُهَوِّنُ بِهِ عَلَيْنَا مَصَائِبَ الدُّنْيَا ، اللَّهُمَّ مَتِّعْنَا بِأَسْمَاعِنَا ، وَأَبْصَارِنَا ، وَقُوَّاتِنَا مَا أَحْيَيْتَنَا ، وَاجْعَلْهُ الْوَارِثَ مِنَّا ، وَاجْعَلْ ثَأْرَنَا عَلَى مَنْ ظَلَمَنَا ، وَانْصُرْنَا عَلَى مَنْ عَادَانَا ، وَلَا تَجْعَلْ مُصِيبَتَنَا فِي دِينِنَا وَلَا تَجْعَلْ الدُّنْيَا أَكْبَرَ هَمِّنَا ، وَلَا مَبْلَغَ عِلْمِنَا ، وَلَا تُسَلِّطْ عَلَيْنَا مَنْ لَا يَرْحَمُنَا.
اللَّهُمَّ إِنَّا نَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ ، وَعَزَائِمَ مَغْفِرَتِكَ ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ ، وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ ، وَالْفَوْزَ بِالْجَنَّةِ ، وَالنَّجَاةَ مِنَ النَّارِ.
اللَّهُمَّ لَا تَدَعْ لَنَا ذَنْبًا إِلَّا غَفَرْتَهُ ، وَلَا هَمًّا إِلَّا فَرَّجْتَهُ ، وَلَا دَيْنًا إِلَّا قَضَيْتَهُ ، وَلَا مَرِيضاً إِلَّا شَفَيْتَهُ ، وَلَا مُبْتَلَى إِلَّا عَافَيْتَهُ ، وَلَا ضَالاً إِلَّا هَدَيْتَهُ ، وَلَا غَائِباً إِلَّا رَدَدْتَهُ ، وَلَا مَظْلُوماً إِلَّا نَصَرْتَهُ ، وَلَا أَسِيراً إِلَّا فَكَكْتَهُ ، وَلَا مَيِّتاً إِلَّا رَحِمْتَهُ ، وَلَا حَاجَةً لَنَا فِيهَا صَلَاحٌ وَلَكَ فِيهَا رِضاً إِلَّا قَضَيْتَهَا وَيَسَّرْتَهَا بِفَضْلِكَ يَا أَكْرَمَ الْأَكْرَمِينَ.
اللَّهُمَّ رَبِّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ ، وَاهْدِنِي وَيَسِّرِ الْهُدَى إِلَيَّ ، وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَيَّ.
اللَّهُمَّ رَبِّ اجْعَلْنِي لَكَ شَكَّاراً ، لَكَ ذَكَّاراً ، لَكَ رَهَّاباً ، لَكَ مِطْوَاعاً ، إِلَيْكَ مُخْبِتاً أَوَّاهاً مُنِيباً ، رَبِّ تَقَبَّلْ تَوْبَتِي ، وَاغْسِلْ حَوْبَتِي ، وَأَجِبْ دَعْوَتِي ، وَثَبِّتْ حُجَّتِي ، وَاهْدِ قَلْبِي ، وَسَدِّدْ لِسَانِي ، وَاسْلُلْ سَخِيمَةَ قَلْبِي.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنَّا نَسْأَلُكَ يُسْراً لَيْسَ بَعْدَهُ عُسْرٌ ، وَغِنًى لَيْسَ بَعْدَهُ فَقْرٌ ، وَأَمْناً لَيْسَ بَعْدَهُ خَوْفٌ ، وَسَعَادَةً لَيْسَ بَعْدَهَا شَقَاءٌ.
اللَّهُمَّ أَلِّفْ بَيْنَ قُلُوبِنَا ، وَأَصْلِحْ ذَاتَ بَيْنِنَا ، وَاهْدِنَا سُبُلَ السَّلَامِ ، وَنَجِّنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ ، وَجَنِّبْنَا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ ، وَبَارِكْ لَنَا فِي أَسْمَاعِنَا ، وَأَبْصَارِنَا ، وَقُلُوبِنَا ، وَأَزْوَاجِنَا ، وَذُرِّيَّاتِنَا ، وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ ، وَاجْعَلْنَا شَاكِرِينَ لِنِعَمِكَ مُثْنِينَ بِهَا عَلَيْكَ قَابِلِينَ لَهَا وَأَتْمِمْهَا عَلَيْنَا.
اللَّهُمَّ يَا مُقَلِّبَ الْقُلُوبِ وَالْأَبْصَارِ ، ثَبِّتْ قُلُوبَنَا عَلَى طَاعَتِكَ ، وَلَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا ، وَلَا تَفْتِنَّا فِي دِينِنَا ، وَاجْعَلْ يَوْمَنَا خَيْراً مِنْ أَمْسِنَا ، وَاجْعَلْ غَدَنَا خَيْراً مِنْ يَوْمِنَا ، وَاجْعَلْ خَيْرَ أَعْمَارِنَا أَوَاخِرَهَا ، وَخَيْرَ أَعْمَالِنَا خَوَاتِيمَهَا ، وَخَيْرَ أَيَّامِنَا يَوْمَ نَلْقَاكَ وَأَنْتَ رَاضٍ عَنَّا.
اللَّهُمَّ أَنْتَ الَّذِي خَلَقْتَنِي فَأَنْتَ تَهْدِينِ ، وَأَنْتَ الَّذِي تُطْعِمُنِي وَتَسْقِينِ ، وَإِذَا مَرِضْتُ فَأَنْتَ تَشْفِينِ ، وَأَنْتَ الَّذِي تُمِيتُنِي ثُمَّ تُحْيِينِ ، وَأَنْتَ الَّذِي أَطْمَعُ أَنْ يَغْفِرَ لِي خَطِيئَتِي يَوْمَ الدِّينِ ، رَبِّ هَبْ لِي حُكْماً وَأَلْحِقْنِي بِالصَّالِحِينَ ، وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ ، وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ ، وَاغْفِرْ لِآبَائِنَا وَأُمَّهَاتِنَا مِنَ الْمُسْلِمِينَ وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ ، يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ ، إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ.
اللَّهُمَّ احْفَظْنِي بِالْإِسْلَامِ قَائِماً ، وَاحْفَظْنِي بِالْإِسْلَامِ قَاعِداً ، وَاحْفَظْنِي بِالْإِسْلَامِ رَاقِداً ، وَلَا تُشْمِتْ بِي عَدُوّاً وَلَا حَاسِداً.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ كُلِّ خَيْرٍ خَزَائِنُهُ بِيَدِكَ ، وَأَعُوذُ بِكَ مِنْ كُلِّ شَرٍّ خَزَائِنُهُ بِيَدِكَ.
اللَّهُمَّ يَا ذَا الْحَبْلِ الشَّدِيدِ ، وَالْأَمْرِ الرَّشِيدِ ، أَسْأَلُكَ الْأَمْنَ يَوْمَ الْوَعِيدِ ، وَالْجَنَّةَ دَارَ الْخُلُودِ ، مَعَ الْمُقَرَّبِينَ الشُّهُودِ ، الرُّكَّعِ السُّجُودِ ، الْمُوفِينَ بِالْعُهُودِ ، إِنَّكَ رَحِيمٌ وَدُودٌ ، وَإِنَّكَ تَفْعَلُ مَا تُرِيدُ.
اللَّهُمَّ اجْعَلْنَا هَادِينَ مُهْتَدِينَ ، غَيْرَ ضَالِّينَ وَلَا مُضِلِّينَ ، سِلْماً لِأَوْلِيَائِكَ ، وَحَرْباً عَلَى أَعْدَائِكَ ، نُحِبُّ بِحُبِّكَ مَنْ أَحَبَّكَ ، وَنُعَادِي بِعَدَاوَتِكَ مَنْ خَالَفَكَ.اللَّهُمَّ هَذَا الدُّعَاءُ وَمِنْكَ الْإِجَابَةُ ، اللَّهُمَّ هَذَا الْجُهْدُ وَعَلَيْكَ التُّكْلَانُ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَاناً لَا يَرْتَدُّ ، وَنَعِيماً لَا يَنْفَدُ ، وَمُرَافَقَةَ نَبِيِّكَ مُحَمَّدٍ فِي أَعْلَى جَنَّةِ الْخُلْدِ.
اللَّهُمَّ آتِنِي الْحِكْمَةَ الَّتِي مَنْ أُوتِيَهَا فَقَدْ أُوتِيَ خَيْراً كَثِيراً.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.
اللَّهُمَّ ارْحَمْنِي ، فَأَنْتَ خَيْرُ الرَّاحِمِينَ ، وَارْزُقْنِي ، فَأَنْتَ خَيْرُ الرَّازِقِينَ ، وَاغْفِرْ لِي فَأَنْتَ خَيْرُ الْغَافِرِينَ ، وَانْصُرْنِي ، فَأَنْتَ خَيْرُ النَّاصِرِينَ.
اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ ، لَا إِلَهَ إِلَّا أَنْتَ.
اللَّهُمَّ زِدْنَا وَلَا تَنْقُصْنَا ، وَأَكْرِمْنَا وَلَا تُهِنَّا ، وَأَعْطِنَا وَلَا تَحْرِمْنَا ، وَآثِرْنَا وَلَا تُؤْثِرْ عَلَيْنَا ، وَأَرْضِنَا وَارْضَ عَنَّا.
اللَّهُمَّ إِنِّي أَسْأَلُكَ عِيشَةً نَقِيَّةً ، وَمِيتَةً سَوِيَّةً ، وَمَرَدّاً غَيْرَ مُخْزٍ وَلَا فَاضِحٍ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ ، وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ وَالْمُعَافَاةَ فِي الدُّنْيَا وَالْآخِرَةِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى ، وَالتُّقَى ، وَالْعَفَافَ وَالْغِنَى.
اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعًا ، وَرِزْقاً طَيِّباً ، وَعَمَلاً مُتَقَبَّلاً.
اللَّهُمَّ اغْفِرْ لِي ، وَاهْدِنِي وَارْزُقْنِي ، وَعَافِنِي ، أَعُوذُ بِاللَّهِ مِنْ ضِيقِ الْمَقَامِ يَوْمَ الْقِيَامَةِ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ قِنِي شَرَّ نَفْسِي ، وَاعْزِمْ لِي عَلَى أَرْشَدِ أَمْرِي ، اللَّهُمَّ اغْفِرْ لِي مَا أَسْرَرْتُ ، وَمَا أَعْلَنْتُ وَمَا أَخْطَأْتُ ، وَمَا عَمَدْتُ ، وَمَا عَلِمْتُ ، وَمَا جَهِلْتُ.
اللَّهُمَّ أَكْثِرْ مَالِي ، وَوَلَدِي ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَنِي ، وَأَطِلْ حَيَاتِي عَلَى طَاعَتِكَ ، وَأَحْسِنْ عَمَلِي وَاغْفِرْ لِي.
اللَّهُمَّ اسْتُرْ عَوَرَاتِي ، وَآمِنْ رَوْعَاتِي ، وَاحْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي ، وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.
اللَّهُمَّ أَكْرِمْنِي وَلَا تُهِنِّي ، وَأَعْطِنِي وَلَا تَحْرِمْنِي ، وَزِدْنِي وَلَا تَنْقُصْنِي ، وَآثِرْنِي وَلَا تُؤْثِرْ عَلَيَّ ، وَارْضَ عَنِّي وَأَرْضِنِي.
اللَّهُمَّ افْتَحْ لَنَا فَتْحاً مُبِيناً ، وَاهْدِنَا صِرَاطاً مُسْتَقِيماً ، وَانْصُرْنَا نَصْراً عَزِيزاً، وَأَتِمَّ عَلَيْنَا نِعْمَتَكَ ، وَأَنْزِلْ فِي قُلُوبِنَا سَكِينَتَكَ ، وَانْشُرْ عَلَيْنَا فَضْلَكَ وَرَحْمَتَكَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَعِنَّا عَلَى شَهَوَاتِ أَنْفُسِنَا، وَقَسْوَةِ قُلُوبِنَا ، وَضَعْفِ إِرَادَتِنَا ، وَلَا تَكِلْنَا إِلَى أَنْفُسِنَا وَلَا إِلَى أَحَدٍ غَيْرِكَ.
اللَّهُمَّ لَا تَكِلْنَا إِلَى أَنْفُسِنَا طَرْفَةَ عَيْنٍ وَلَا أَقَلَّ مِنْ ذَلِكَ.
اللَّهُمَّ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.
اللَّهُمَّ اشْغَلْ قُلُوبَنَا بِحُبِّكَ ، وَأَلْسِنَتَنَا بِذِكْرِكَ ، وَأَبْدَانِنَا بِطَاعَتِكَ ، وَعُقُولَنَا بِالتَّفَكُّرِ فِي خَلْقِكَ وَالتَّفَقُّهِ فِي دِينِكَ.
اللَّهُمَّ اشْفِ مَرْضَانَا ، وَارْحَمْ مَوْتَانَا ، وَعَافِ مُبْتَلَانَا ، وَفُكَّ أَسْرَنَا ، وَاجْبُرْ كَسْرَنَا.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَطْعِمْنَا مِنْ جُوعٍ ، وَآمِنَّا مِنْ خَوْفٍ، وَقَوِّنَا مِنْ ضَعْفٍ ، وَعَلِّمْنَا مِنْ جَهَالَةٍ، وَأَنْقِذْنَا مِنْ ضَلَالَةٍ.
اللَّهُمَّ اخْتِمْ بِالصَّالِحَاتِ أَعْمَالَنَا ، وَبِالسَّعَادَةِ آجَالَنَا ، وَبَلِّغْنَا مِمَّا يُرْضِيكَ آمَالَنَا.
اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي ، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي, وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي ، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ.
اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي أَوَاخِرَهُ ، وَخَيْرَ عَمَلِي خَوَاتِمَهُ ، وَخَيْرَ أَيَّامِي يَوْمَ لِقَاكَ.
اللَّهُمَّ احْفَظْنِي بِالْإِسْلَامِ قَائِماً ، وَاحْفَظْنِي بِالْإِسْلَامِ قَاعِداً ، وَاحْفَظْنِي بِالْإِسْلَامِ رَاقِداً ، وَلَا تُشْمِتْ بِيَ عَدُوًّا وَلَا حَاسِدًا.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"},{t:`اللَّهُمَّ أَحْيِنَا مُسْلِمِينَ ، وَتَوَفَّنَا مُسْلِمِينَ ، وَأَلْحِقْنَا بِالصَّالِحِينَ.
اللَّهُمَّ أَبْرِمْ لِهَذِهِ الْأُمَّةِ أَمْرَ رُشْدٍ ، يُعَزُّ فِيهِ أَهْلُ طَاعَتِكَ ، وَيُذَلُّ فِيهِ أَهْلُ مَعْصِيَتِكَ ، وَيُؤْمَرُ فِيهِ بِالْمَعْرُوفِ ، وَيُنْهَى فِيهِ عَنِ الْمُنْكَرِ.
اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى عَبْدِكَ وَرَسُولِكَ مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ.`,c:1,s:"أدعية جامعة من القرآن والسنة وغيرها",f:"gen",w:"أدعية عامة جمعها الموقع؛ فيها المأثور وغير المأثور، وليست أحاديث بنصها"}]},{k:"khatm",ar:"دعاء ختم القرآن",en:"Completing the Quran",items:[{t:`اللَّهُمَّ ارْحَمْنِي بِالْقُرْآنِ وَاجْعَلْهُ لِي إِمَاماً وَنُوراً وَهُدًى وَرَحْمَةً *
اللَّهُمَّ ذَكِّرْنِي مِنْهُ مَا نَسِيتُ وَعَلِّمْنِي مِنْهُ مَا جَهِلْتُ وَارْزُقْنِي تِلَاوَتَهُ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ وَاجْعَلْهُ لِي حُجَّةً يَا رَبَّ الْعَالَمِينَ *
اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ *
اللَّهُمَّ اجْعَلْ خَيْرَ عُمْرِي آخِرَهُ وَخَيْرَ عَمَلِي خَوَاتِمَهُ وَخَيْرَ أَيَّامِي يَوْمَ أَلْقَاكَ فِيهِ *
اللَّهُمَّ إِنِّي أَسْأَلُكَ عِيشَةً هَنِيَّةً وَمِيتَةً سَوِيَّةً وَمَرَدًّا غَيْرَ مُخْزٍ وَلَا فَاضِحٍ *
اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَسْأَلَةِ وَخَيْرَ الدُّعَاءِ وَخَيْرَ النَّجَاحِ وَخَيْرَ الْعِلْمِ وَخَيْرَ الْعَمَلِ وَخَيْرَ الثَّوَابِ وَخَيْرَ الْحَيَاةِ وَخَيْرَ الْمَمَاتِ وَثَبِّتْنِي وَثَقِّلْ مَوَازِينِي وَحَقِّقْ إِيمَانِي وَارْفَعْ دَرَجَتِي وَتَقَبَّلْ صَلَاتِي وَاغْفِرْ خَطِيئَاتِي وَأَسْأَلُكَ الْعُلَا مِنَ الْجَنَّةِ *
اللَّهُمَّ إِنِّي أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ وَعَزَائِمِ مَغْفِرَتِكَ وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ وَالْفَوْزَ بِالْجَنَّةِ وَالنَّجَاةَ مِنَ النَّارِ *

رمضان شهر الله المحرم",s:"رواه مسلم"},{t:"صيام يوم عاشوراء أحتسب على الله أن يكفّر السنة التي قبله",s:"رواه مسلم"},{t:"لئن بقيت إلى قابل لأصومنّ التاسع",s:"رواه مسلم"},{t:"ما رأيت النبي ﷺ يتحرّى صيام يوم فضّله على غيره إلا هذا اليوم: يوم عاشوراء، وهذا الشهر يعني شهر رمضان",s:"متفق عليه — عن ابن عباس رضي الله عنهما"}]},{id:"friday",ar:"فضائل يوم الجمعة",en:"Virtues of Friday",when:["يوم الجمعة","Every Friday"],items:[{t:"﴿يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع ذلكم خير لكم إن كنتم تعلمون﴾",s:"سورة الجمعة: 9"},{t:"خير يوم طلعت عليه الشمس يوم الجمعة: فيه خُلق آدم، وفيه أُدخل الجنة، وفيه أُخرج منها، ولا تقوم الساعة إلا في يوم الجمعة",s:"رواه مسلم"},{t:"إن من أفضل أيامكم يوم الجمعة… فأكثروا عليّ من الصلاة فيه، فإن صلاتكم معروضة عليّ",s:"رواه أبو داود والنسائي، وصححه الألباني"},{t:"من قرأ سورة الكهف يوم الجمعة أضاء له من النور ما بين الجمعتين",s:"رواه الحاكم والبيهقي، وصححه الألباني"},{t:"من اغتسل يوم الجمعة غسل الجنابة ثم راح فكأنما قرّب بدنة، ومن راح في الساعة الثانية فكأنما قرّب بقرة",s:"متفق عليه"},{t:"لا يغتسل رجل يوم الجمعة، ويتطهر ما استطاع من طهر، ويدّهن من دهنه أو يمس من طيب بيته، ثم يخرج فلا يفرّق بين اثنين، ثم يصلي ما كُتب له، ثم ينصت إذا تكلم الإمام، إلا غُفر له ما بينه وبين الجمعة الأخرى",s:"رواه البخاري"},{t:"كان النبي ﷺ يقرأ في الجمعة في صلاة الفجر: «الم تنزيل» السجدة، و«هل أتى على الإنسان»",s:"متفق عليه"}]},{id:"fridayHour",ar:"آخر ساعة من يوم الجمعة",en:"Last hour of Friday",when:["يوم الجمعة من العصر إلى المغرب","Friday from Asr to Maghrib"],items:[{t:"ذكر رسول الله ﷺ يوم الجمعة فقال: «فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله تعالى شيئًا إلا أعطاه إياه»",s:"متفق عليه"},{t:"يوم الجمعة ثنتا عشرة — يريد ساعة — لا يوجد مسلم يسأل الله عز وجل شيئًا إلا آتاه الله عز وجل، فالتمسوها آخر ساعة بعد العصر",s:"رواه أبو داود والنسائي، وصححه الألباني"}]},{id:"ramadan",ar:"أحاديث رمضان",en:"Ramadan hadiths",when:["طوال شهر رمضان","All of Ramadan"],items:[{t:"﴿يا أيها الذين آمنوا كتب عليكم الصيام كما كتب على الذين من قبلكم لعلكم تتقون﴾",s:"سورة البقرة: 183"},{t:"﴿شهر رمضان الذي أنزل فيه القرآن هدى للناس وبينات من الهدى والفرقان فمن شهد منكم الشهر فليصمه﴾",s:"سورة البقرة: 185"},{t:"من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه",s:"متفق عليه"},{t:"من قام رمضان إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه",s:"متفق عليه"},{t:"من فطّر صائمًا كان له مثل أجره، غير أنه لا ينقص من أجر الصائم شيئًا",s:"رواه الترمذي وابن ماجه، وصححه الألباني"},{t:"كان رسول الله ﷺ أجود الناس، وكان أجود ما يكون في رمضان حين يلقاه جبريل فيدارسه القرآن",s:"متفق عليه"},{t:"من لم يدع قول الزور والعمل به، فليس لله حاجة في أن يدع طعامه وشرابه",s:"رواه البخاري"},{t:"الصيام جُنّة، فإذا كان يوم صوم أحدكم فلا يرفث ولا يصخب، فإن سابّه أحد أو قاتله فليقل: إني امرؤ صائم",s:"متفق عليه"},{t:"تسحّروا فإن في السحور بركة",s:"متفق عليه"},{t:"لا يزال الناس بخير ما عجّلوا الفطر",s:"متفق عليه"},{t:"إن في الجنة بابًا يقال له الريّان، يدخل منه الصائمون يوم القيامة، لا يدخل منه أحد غيرهم",s:"متفق عليه"},{t:"فإن عمرة في رمضان تعدل حجة",s:"متفق عليه، واللفظ لمسلم"}]},{id:"ram1",ar:"العشر الأوائل من رمضان",en:"First ten of Ramadan",when:["من ١ إلى ١٠ رمضان","1st–10th Ramadan"],items:[{t:"إذا جاء رمضان فُتّحت أبواب الجنة، وغُلّقت أبواب النار، وصُفّدت الشياطين",s:"متفق عليه"},{t:"﴿أياما معدودات فمن كان منكم مريضا أو على سفر فعدة من أيام أخر﴾",s:"سورة البقرة: 184"},{t:"قال الله: كل عمل ابن آدم له إلا الصيام، فإنه لي وأنا أجزي به",s:"متفق عليه"}]},{id:"ram2",ar:"العشر الوسطى من رمضان",en:"Middle ten of Ramadan",when:["من ١١ إلى ٢٠ رمضان","11th–20th Ramadan"],items:[{t:"﴿وإذا سألك عبادي عني فإني قريب أجيب دعوة الداع إذا دعان فليستجيبوا لي وليؤمنوا بي لعلهم يرشدون﴾",s:"سورة البقرة: 186"},{t:"للصائم فرحتان يفرحهما: إذا أفطر فرح، وإذا لقي ربه فرح بصومه",s:"متفق عليه"},{t:"ولَخُلوف فم الصائم أطيب عند الله من ريح المسك",s:"متفق عليه"},{t:"من صام يومًا في سبيل الله بعّد الله وجهه عن النار سبعين خريفًا",s:"متفق عليه"}]},{id:"ram3",ar:"العشر الأواخر من رمضان",en:"Last ten of Ramadan",when:["من ٢١ رمضان إلى آخره","21st Ramadan to the end"],items:[{t:"﴿ليلة القدر خير من ألف شهر﴾",s:"سورة القدر: 3"},{t:"كان رسول الله ﷺ إذا دخل العشر أحيا الليل، وأيقظ أهله، وجدّ وشدّ المئزر",s:"رواه مسلم"},{t:"كان رسول الله ﷺ يجتهد في العشر الأواخر ما لا يجتهد في غيره",s:"رواه مسلم"},{t:"تحرّوا ليلة القدر في الوتر من العشر الأواخر من رمضان",s:"رواه البخاري"},{t:"من قام ليلة القدر إيمانًا واحتسابًا غُفر له ما تقدم من ذنبه",s:"متفق عليه"},{t:"قالت عائشة: يا رسول الله، أرأيت إن علمت أي ليلة ليلة القدر ما أقول فيها؟ قال: «قولي: اللهم إنك عفوّ تحب العفو فاعفُ عني»",s:"رواه الترمذي وابن ماجه، وصححه الألباني"},{t:"أن النبي ﷺ كان يعتكف العشر الأواخر من رمضان حتى توفّاه الله",s:"متفق عليه"}]},{id:"fitrEve",ar:"قبل عيد الفطر (زكاة الفطر)",en:"Before Eid al-Fitr",when:["من ٢٧ رمضان إلى آخره (قبل العيد بثلاثة أيام)","27th Ramadan to the end"],items:[{t:"﴿ولتكملوا العدة ولتكبروا الله على ما هداكم ولعلكم تشكرون﴾",s:"سورة البقرة: 185"},{t:"فرض رسول الله ﷺ زكاة الفطر صاعًا من تمر أو صاعًا من شعير، على العبد والحر، والذكر والأنثى، والصغير والكبير من المسلمين، وأمر بها أن تؤدّى قبل خروج الناس إلى الصلاة",s:"متفق عليه"},{t:"فرض رسول الله ﷺ زكاة الفطر طُهرة للصائم من اللغو والرفث، وطُعمة للمساكين",s:"رواه أبو داود وابن ماجه، وحسّنه الألباني"},{t:"وكانوا يُعطون قبل الفطر بيوم أو يومين",s:"رواه البخاري — عن ابن عمر رضي الله عنهما"},{t:"كان رسول الله ﷺ لا يغدو يوم الفطر حتى يأكل تمرات، ويأكلهن وترًا",s:"رواه البخاري"},{t:"الله أكبر، الله أكبر، لا إله إلا الله، والله أكبر، الله أكبر، ولله الحمد",s:"التكبير ليلة العيد — أثر عن ابن مسعود رضي الله عنه، رواه ابن أبي شيبة بإسناد صحيح"}]},{id:"fitr",ar:"يوم عيد الفطر",en:"Eid al-Fitr",when:["من ١ إلى ٣ شوال","1st–3rd Shawwal"],items:[{t:"تقبّل الله منا ومنكم",s:"التهنئة بالعيد — أثر عن الصحابة رضي الله عنهم، حسّن إسناده ابن حجر"},{t:"قدم رسول الله ﷺ المدينة ولهم يومان يلعبون فيهما، فقال: «إن الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى، ويوم الفطر»",s:"رواه أبو داود والنسائي، وصححه الألباني"},{t:"كان النبي ﷺ إذا كان يوم عيد خالف الطريق",s:"رواه البخاري"},{t:"أمرنا رسول الله ﷺ أن نُخرجهن في الفطر والأضحى: العواتق والحُيّض وذوات الخدور، فأما الحُيّض فيعتزلن الصلاة، ويشهدن الخير ودعوة المسلمين",s:"رواه مسلم — عن أم عطية رضي الله عنها"},{t:"نهى رسول الله ﷺ عن صيام يومين: يوم الفطر، ويوم النحر",s:"متفق عليه"}]},{id:"shawwal",ar:"صيام ست من شوال",en:"Six days of Shawwal",when:["آخر رمضان (من ٢٥) وطوال شوال بعد يوم العيد","End of Ramadan and Shawwal"],items:[{t:"من صام رمضان ثم أتبعه ستًا من شوال كان كصيام الدهر",s:"رواه مسلم"},{t:"صيام شهر رمضان بعشرة أشهر، وصيام ستة أيام بعده بشهرين، فذلك صيام السنة",s:"رواه النسائي في الكبرى وابن خزيمة، وصححه الألباني"}]},{id:"dhul10",ar:"العشر من ذي الحجة",en:"First ten of Dhul-Hijjah",when:["من ١ إلى ٩ ذو الحجة","1st–9th Dhul-Hijjah"],items:[{t:"﴿والفجر وليال عشر﴾",s:"سورة الفجر: 1–2"},{t:"﴿ويذكروا اسم الله في أيام معلومات على ما رزقهم من بهيمة الأنعام﴾",s:"سورة الحج: 28"},{t:"ما من أيام العمل الصالح فيها أحب إلى الله من هذه الأيام — يعني أيام العشر — قالوا: يا رسول الله، ولا الجهاد في سبيل الله؟ قال: «ولا الجهاد في سبيل الله، إلا رجل خرج بنفسه وماله فلم يرجع من ذلك بشيء»",s:"رواه أبو داود والترمذي، وأصله في البخاري"},{t:"إذا دخلت العشر وأراد أحدكم أن يضحّي فلا يمسّ من شعره وبشره شيئًا",s:"رواه مسلم"},{t:"كان ابن عمر وأبو هريرة يخرجان إلى السوق في أيام العشر يكبّران، ويكبّر الناس بتكبيرهما",s:"ذكره البخاري في صحيحه معلّقًا"},{t:"من حجّ لله فلم يرفث ولم يفسق رجع كيوم ولدته أمه",s:"متفق عليه"},{t:"العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة",s:"متفق عليه"}]},{id:"arafah",ar:"يوم عرفة",en:"Day of Arafah",when:["من ٦ إلى ٩ ذو الحجة (قبل عرفة بثلاثة أيام)","6th–9th Dhul-Hijjah"],items:[{t:"﴿اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا﴾",s:"سورة المائدة: 3"},{t:"صيام يوم عرفة أحتسب على الله أن يكفّر السنة التي قبله والسنة التي بعده",s:"رواه مسلم"},{t:"ما من يوم أكثر من أن يُعتق الله فيه عبدًا من النار من يوم عرفة",s:"رواه مسلم"},{t:"خير الدعاء دعاء يوم عرفة، وخير ما قلت أنا والنبيون من قبلي: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير",s:"رواه الترمذي، وحسّنه الألب
