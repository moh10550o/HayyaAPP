قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.`,c:3,s:"رواه أبو داود والترمذي من حديث عبد الله بن خُبيب، وحسّنه الألباني"},{t:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ.`,c:3,s:"رواه أبو داود والترمذي من حديث عبد الله بن خُبيب، وحسّنه الألباني"},{t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",c:1,s:"رواه مسلم"},{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .",c:1,v:"مَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.",s:"رواه البخاري"},{t:"رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.",c:3,v:"مَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.",s:"رواه أبو داود والترمذي",f:"disp",w:"مختلف في ثبوت هذا الفضل بهذا العدد: حسّنه بعض العلماء وضعّفه آخرون (منهم الألباني). وأصل «رضيت بالله ربًا…» صحيح عند مسلم في غير هذا الموضع."},{t:"اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.",c:4,v:"مَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.",s:"رواه أبو داود",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف أبي داود)"},{t:"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.",c:1,v:"مَنْ قَالَهَا حِينَ يُصْبِحُ أَدَّى شُكْرَ يَوْمِهِ.",s:"رواه أبو داود",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف أبي داود)"},{t:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",c:7,v:"مَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.",s:"رواه أبو داود موقوفًا على أبي الدرداء",f:"weak",w:"لا يصح مرفوعًا إلى النبي ﷺ، والفضل المذكور لم يثبت — ضعّفه الألباني"},{t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",c:3,v:"لَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.",s:"رواه أبو داود والترمذي وابن ماجه من حديث عثمان بن عفان، وصححه الألباني"},{t:"اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا ، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.",c:1,s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.",c:1,s:"رواه أحمد والنسائي في عمل اليوم والليلة، وصححه الألباني"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.",c:3,s:"رواه مسلم من حديث جويرية رضي الله عنها"},{t:"اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.",c:3,s:"رواه أبو داود وأحمد من حديث أبي بكرة، وحسّنه الألباني"},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.",c:3,s:"رواه أبو داود من حديث أبي بكرة، وحسّنه الألباني"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.",c:1,s:"رواه أبو داود وابن ماجه من حديث ابن عمر، وصححه الألباني"},{t:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.",c:3,s:"رواه النسائي في الكبرى والحاكم من حديث أنس، وحسّنه الألباني (صحيح الترغيب 661)"},{t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ ، فَتْحَهُ ، وَنَصْرَهُ ، وَنُورَهُ وَبَرَكَتَهُ ، وَهُدَاهُ ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ.",c:1,s:"رواه أبو داود",f:"disp",w:"مختلف في ثبوته: في إسناده مقال، وضعّفه بعض المحققين"},{t:"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.",c:1,s:"رواه أبو داود والترمذي من حديث أبي هريرة، وصححه الألباني"},{t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",c:3,s:"رواه مسلم، وقولها ثلاثًا عند المساء عند أحمد والترمذي، وصححه الألباني"},{t:"اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.",c:3,s:"رواه أحمد من حديث أبي موسى، وصححه الألباني لغيره (صحيح الترغيب 36)"},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.",c:3,s:"رواه البخاري من حديث أنس"},{t:"أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ، الْحَيَّ الْقَيُّومَ، وَأَتُوبُ إِلَيْهِ.",c:3,s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"يَا رَبِّ , لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ , وَلِعَظِيمِ سُلْطَانِكَ.",c:3,s:"رواه ابن ماجه",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف ابن ماجه)"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.",c:1,s:"رواه ابن ماجه وأحمد من حديث أم سلمة (بعد صلاة الصبح)، وصححه الألباني"},{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، عَلَيْكَ تَوَكَّلْتُ ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ , مَا شَاءَ اللَّهُ كَانَ ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ , أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا , اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي ، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا ، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.",c:1,v:"ذِكْرٌ طَيِّبٌ.",s:"رواه ابن السني",f:"weak",w:"إسناده ضعيف جدًا — لا يثبت عن النبي ﷺ"},{t:"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",c:10,v:"مَنْ صَلَّى عَلَيَّ حِينَ يُصْبِحُ وَحِينَ يُمْسِي أَدْرَكَتْهُ شَفَاعَتِي يَوْمَ الْقِيَامَةِ.",s:"رواه الطبراني",f:"weak",w:"الفضل المذكور («أدركته شفاعتي») إسناده ضعيف على الأرجح. والصلاة على النبي ﷺ مشروعة في كل وقت: «من صلى علي صلاة صلى الله عليه بها عشرًا» — رواه مسلم"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:100,v:"كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَتْ لَهُ مِئَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِئَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ.",s:"متفق عليه من حديث أبي هريرة"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",c:100,v:"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ.",s:"رواه مسلم، وأصله متفق عليه"},{t:"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",c:100,v:"قال رسول الله ﷺ: «يا أيها الناس توبوا إلى الله، فإني أتوب في اليوم إليه مائة مرة»",s:"رواه مسلم من حديث الأغرّ المزني، وعند البخاري: «أكثر من سبعين مرة»"}],evening:[{t:`أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ. [آيَةُ الْكُرْسِيِّ - الْبَقَرَةُ 255].`,c:1,v:"مَنْ قَالَهَا حِينَ يُصْبِحُ أُجِيرَ مِنَ الْجِنِّ حَتَّى يُمْسِيَ وَمَنْ قَالَهَا حِينَ يُمْسِي أُجِيرَ مِنَ الْجِنِّ حَتَّى يُصْبِحَ.",s:"رواه النسائي في عمل اليوم والليلة والحاكم من حديث أُبيّ بن كعب، وصححه الألباني"},{t:`أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ. لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ. [الْبَقَرَةُ 285 - 286].`,c:1,v:"مَنْ قَرَأَ آيَتَيْنِ مِنْ آخِرِ سُورَةِ الْبَقَرَةِ فِي لَيْلَةٍ كَفَتَاهُ.",s:"متفق عليه من حديث أبي مسعود الأنصاري"},{t:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ.`,c:3,v:"مَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَفَتْهُ مِنْ كُلِّ شَيْءٍ (الْإِخْلَاصِ وَالْمُعَوِّذَتَيْنِ).",s:"رواه أبو داود والترمذي من حديث عبد الله بن خُبيب، وحسّنه الألباني"},{t:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.`,c:3,s:"رواه أبو داود والترمذي من حديث عبد الله بن خُبيب، وحسّنه الألباني"},{t:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ.`,c:3,s:"رواه أبو داود والترمذي من حديث عبد الله بن خُبيب، وحسّنه الألباني"},{t:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",c:1,s:"رواه مسلم"},{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ .",c:1,v:"مَنْ قَالَهَا مُوقِنًا بِهَا حِينَ يُمْسِي وَمَاتَ مِنْ لَيْلَتِهِ دَخَلَ الْجَنَّةَ وَكَذَلِكَ حِينَ يُصْبِحُ.",s:"رواه البخاري"},{t:"رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.",c:3,v:"مَنْ قَالَهَا حِينَ يُصْبِحُ وَحِينَ يُمْسِي كَانَ حَقًّا عَلَى اللَّهِ أَنْ يُرْضِيَهُ يَوْمَ الْقِيَامَةِ.",s:"رواه أبو داود والترمذي",f:"disp",w:"مختلف في ثبوت هذا الفضل بهذا العدد: حسّنه بعض العلماء وضعّفه آخرون (منهم الألباني). وأصل «رضيت بالله ربًا…» صحيح عند مسلم في غير هذا الموضع."},{t:"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ ، وَمَلَائِكَتَكَ ، وَجَمِيعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.",c:4,v:"مَنْ قَالَهَا أَعْتَقَهُ اللَّهُ مِنَ النَّارِ.",s:"رواه أبو داود",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف أبي داود)"},{t:"اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.",c:1,v:"مَنْ قَالَهَا حِينَ يُمْسِي أَدَّى شُكْرَ يَوْمِهِ.",s:"رواه أبو داود",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف أبي داود)"},{t:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",c:7,v:"مَنْ قَالَهَا كَفَاهُ اللَّهُ مَا أَهَمَّهُ مِنْ أَمْرِ الدُّنْيَا وَالْآخِرَةِ.",s:"رواه أبو داود موقوفًا على أبي الدرداء",f:"weak",w:"لا يصح مرفوعًا إلى النبي ﷺ، والفضل المذكور لم يثبت — ضعّفه الألباني"},{t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",c:3,v:"لَمْ يَضُرَّهُ مِنَ اللَّهِ شَيْءٌ.",s:"رواه أبو داود والترمذي وابن ماجه من حديث عثمان بن عفان، وصححه الألباني"},{t:"اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.",c:1,s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.",c:1,s:"رواه أحمد والنسائي في عمل اليوم والليلة، وصححه الألباني"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.",c:3,s:"رواه مسلم من حديث جويرية رضي الله عنها"},{t:"اللَّهُمَّ عَافِنِي فِي بَدَنِي ، اللَّهُمَّ عَافِنِي فِي سَمْعِي ، اللَّهُمَّ عَافِنِي فِي بَصَرِي ، لَا إِلَهَ إِلَّا أَنْتَ.",c:3,s:"رواه أبو داود وأحمد من حديث أبي بكرة، وحسّنه الألباني"},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ ، وَالْفَقْرِ ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلَهَ إِلَّا أَنْتَ.",c:3,s:"رواه أبو داود من حديث أبي بكرة، وحسّنه الألباني"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي ، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي ، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي ، وَمِنْ فَوْقِي ، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.",c:1,s:"رواه أبو داود وابن ماجه من حديث ابن عمر، وصححه الألباني"},{t:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.",c:3,s:"رواه النسائي في الكبرى والحاكم من حديث أنس، وحسّنه الألباني (صحيح الترغيب 661)"},{t:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ فَتْحَهَا وَنَصْرَهَا، وَنُورَهَا وَبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا.",c:1,s:"رواه أبو داود",f:"disp",w:"مختلف في ثبوته: في إسناده مقال، وضعّفه بعض المحققين"},{t:"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.",c:1,s:"رواه أبو داود والترمذي من حديث أبي هريرة، وصححه الألباني"},{t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",c:3,s:"رواه مسلم، وقولها ثلاثًا عند المساء عند أحمد والترمذي، وصححه الألباني"},{t:"اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.",c:3,s:"رواه أحمد من حديث أبي موسى، وصححه الألباني لغيره (صحيح الترغيب 36)"},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.",c:3,s:"رواه البخاري من حديث أنس"},{t:"أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ، الْحَيَّ الْقَيُّومَ، وَأَتُوبُ إِلَيْهِ.",c:3,s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"يَا رَبِّ , لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ , وَلِعَظِيمِ سُلْطَانِكَ.",c:3,s:"رواه ابن ماجه",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف ابن ماجه)"},{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، عَلَيْكَ تَوَكَّلْتُ ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ , مَا شَاءَ اللَّهُ كَانَ ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ , أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا , اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي ، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا ، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.",c:1,v:"ذِكْرٌ طَيِّبٌ.",s:"رواه ابن السني",f:"weak",w:"إسناده ضعيف جدًا — لا يثبت عن النبي ﷺ"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",c:100,v:"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ.",s:"رواه مسلم، وأصله متفق عليه"},{t:"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",c:10,v:"مَنْ صَلَّى عَلَيَّ حِينَ يُصْبِحُ وَحِينَ يُمْسِي أَدْرَكَتْهُ شَفَاعَتِي يَوْمَ الْقِيَامَةِ.",s:"رواه الطبراني",f:"weak",w:"الفضل المذكور («أدركته شفاعتي») إسناده ضعيف على الأرجح. والصلاة على النبي ﷺ مشروعة في كل وقت: «من صلى علي صلاة صلى الله عليه بها عشرًا» — رواه مسلم"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:100,v:"كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَتْ لَهُ مِئَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِئَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ.",s:"متفق عليه من حديث أبي هريرة"}],after:[{t:`أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ.
اللَّهُمَّ أَنْتَ السَّلَامُ ، وَمِنْكَ السَّلَامُ ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ .`,c:1,s:"رواه مسلم من حديث ثوبان"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.",c:1,s:"متفق عليه من حديث المغيرة بن شعبة"},{t:"لَا إِلَهَ إِلَّا اللَّهُ، وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ.",c:1,s:"رواه مسلم من حديث عبد الله بن الزبير"},{t:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ ، وَاللَّهُ أَكْبَرُ.",c:33,s:"رواه مسلم من حديث أبي هريرة"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:1,s:"رواه مسلم من حديث أبي هريرة — تمام المائة"},{t:`بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ.
بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.
بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ.`,c:3,v:"ثَلَاثَ مَرَّاتٍ بَعْدَ صَلَاتَيِ الْفَجْرِ وَالْمَغْرِبِ. وَمَرَّةً بَعْدَ الصَّلَوَاتِ الْأُخْرَى.",s:"رواه أبو داود والترمذي والنسائي من حديث عقبة بن عامر، وصححه الألباني (مرة دبر كل صلاة)؛ والتثليث بعد الفجر والمغرب لحديث أذكار الصباح والمساء"},{t:`أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ. [آيَةُ الْكُرْسِيِّ - الْبَقَرَةُ 255]`,c:1,s:"رواه النسائي في الكبرى من حديث أبي أمامة، وصححه الألباني"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:10,v:"عَشْرَ مَرَّاتٍ بَعْدَ الْمَغْرِبِ وَالصُّـبْحِ.",s:"رواه الترمذي وأحمد، وصححه الألباني لغيره (صحيح الترغيب 477)"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا ، وَعَمَلًا مُتَقَبَّلًا.",c:1,v:"بَعْدَ السَّلَامِ مِنْ صَلَاةِ الْفَجْرِ.",s:"رواه ابن ماجه وأحمد من حديث أم سلمة، وصححه الألباني"},{t:"اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ.",c:7,v:"بَعْدَ صَلَاةِ الصُّبْحِ وَالْمَغْرِبِ.",s:"رواه أبو داود",f:"weak",w:"إسناده ضعيف — ضعّفه الألباني (ضعيف أبي داود)"},{t:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",c:1,s:"رواه أبو داود والنسائي من حديث معاذ بن جبل، وصححه الألباني"}],masjid:[{t:'يَقُولُ مِثْلَ مَا يَقُولُ الْمُؤَذِّنُ إِلَّا فِي "حَيَّ عَلَى الصَّلَاةِ وَحَيَّ عَلَى الْفَلَاحِ" فَيَقُولُ: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ".',c:1,h:"مَا يُقَالُ عِنْدَ سَمَاعِ الْأَذَانِ",s:"متفق عليه، والاستثناء عند «حي على الصلاة» و«حي على الفلاح» عند مسلم"},{t:'عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ أَنَّهُ قَالَ: "مَنْ قَالَ حِينَ يَسْمَعُ الْمُؤَذِّنَ : أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ ، رَضِيتُ بِاللَّهِ رَبًّا ، وَبِمُحَمَّدٍ رَسُولًا ، وَبِالْإِسْلَامِ دِينًا ، غُفِرَ لَهُ ذَنْبُهُ". رَوَاهُ مُسْلِمٌ .',c:1,s:"رواه مسلم"},{t:'عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ رَضِيَ اللَّهُ عَنْهُمَا أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ : "إِذَا سَمِعْتُمُ النِّدَاءَ فَقُولُوا مِثْلَ مَا يَقُولُ ، ثُمَّ صَلُّوا عَلَيَّ ، فَإِنَّهُ مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا ، ثُمَّ سَلُوا اللَّهَ لِيَ الْوَسِيلَةَ ، فَإِنَّهَا مَنْزِلَةٌ فِي الْجَنَّةِ لَا تَنْبَغِي إِلَّا لِعَبْدٍ مِنْ عِبَادِ اللَّهِ وَأَرْجُو أَنْ أَكُونَ أَنَا هُوَ ، فَمَنْ سَأَلَ لِيَ الْوَسِيلَةَ حَلَّتْ لَهُ الشَّفَاعَةُ". رَوَاهُ مُسْلِمٌ .',c:1,s:"رواه مسلم"},{t:'عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ : "مَنْ قَالَ حِينَ يَسْمَعُ النِّدَاءَ : اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ ، وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ ، حَلَّتْ لَهُ شَفَاعَتِي يَوْمَ الْقِيَامَةِ" .رَوَاهُ الْبُخَارِيُّ .',c:1,s:"رواه البخاري"},{t:`اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ.
اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ.`,c:1,h:"مَا يُقَالُ بَعْدَ سَمَاعِ الْأَذَانِ",s:"الصلاة على النبي ﷺ بعد الأذان عند مسلم، والدعاء لفظ البخاري",x:"حُذفت زيادة «إنك لا تخلف الميعاد» لأنها لم تثبت (زيادة شاذة عند البيهقي)"},{t:`مَا بَيْنَ الْأَذَانِ وَالْإِقَامَةِ فَالدُّعَاءُ عِنْدَئِذٍ مُرَغَّبٌ فِيهِ وَمُسْتَحَبٌّ.
قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: "الدُّعَاءُ لَا يُرَدُّ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ".
قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: "إِنَّ الدُّعَاءَ لَا يُرَدُّ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ فَادْعُوا".`,c:1,h:"مَا يُقَالُ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ",s:"رواه أبو داود والترمذي وأحمد من حديث أنس، وصححه الألباني"},{t:`اللَّهُ أَكْبَرُ ، اللَّهُ أَكْبَرُ

أَعُوذُ بِاللَّهِ الْعَظِيمِ وَبِوَجْهِهِ الْكَرِيمِ وَسُلْطَانِهِ الْقَدِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.`,c:1,h:"دُعَاءُ دُخُولِ الْمَسْجِدِ",s:"رواه أبو داود (الاستعاذة) وابن السني (التسمية) ومسلم («اللهم افتح لي أبواب رحمتك»)، وصححه الألباني"},{t:`يَبْدَأُ بِرِجْلِهِ الْيُسْرَى، وَيَقُولُ:
بِسْمِ اللَّهِ وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ.`,c:1,h:"دُعَاءُ الْخُرُوجِ مِنَ الْمَسْجِدِ",s:"رواه مسلم («اللهم إني أسألك من فضلك») وابن ماجه («اللهم اعصمني من الشيطان الرجيم»)، وصححه الألباني"}]},IB_CATS=[{k:"tasabeeh",ar:"تسابيح",en:"Tasbeeh",items:[{t:"سُبْحَانَ اللَّهِ",c:100,v:"يُكْتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ.",s:"رواه مسلم من حديث سعد بن أبي وقاص"},{t:"اللَّهُ أَكْبَرُ",c:100,v:"مَنْ قَالَ اللَّهُ أَكْبَرُ كُتِبَتْ لَهُ عِشْرُونَ حَسَنَةً وَحُطَّتْ عَنْهُ عِشْرُونَ سَيِّئَةً. اللَّهُ أَكْبَرُ مِنْ كُلِّ شَيْءٍ.",s:"رواه أحمد والنسائي في الكبرى والحاكم، وصححه الألباني (صحيح الجامع 1718)"},{t:"أَسْتَغْفِرُ اللَّهَ",c:100,v:"لِفِعْلِ الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.",s:"رواه مسلم: «إني لأستغفر الله في اليوم مائة مرة»"},{t:"لَا إِلَهَ إِلَّا اللَّهُ",c:100,v:"أَفْضَلُ الذِّكْرِ لَا إِلَهَ إِلَّا اللَّهُ.",s:"رواه الترمذي وابن ماجه من حديث جابر، وحسّنه الألباني"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",c:100,v:"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ.",s:"متفق عليه، و«لم يأت أحد يوم القيامة بأفضل…» عند مسلم"},{t:"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",c:100,v:"تَمْلَأُ مِيزَانَ الْعَبْدِ بِالْحَسَنَاتِ.",s:"رواه مسلم: «والحمد لله تملأ الميزان»"},{t:"سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ",c:100,v:"تَمْلَآنِ مَا بَيْنَ السَّمَاوَاتِ وَالْأَرْضِ.",s:"رواه مسلم من حديث أبي مالك الأشعري"},{t:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",c:100,v:"كَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ (أَيُّ عَدَدٍ).",s:"متفق عليه من حديث أبي موسى"},{t:"سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ",c:100,v:"غُرِسَتْ لَهُ نَخْلَةٌ فِي الْجَنَّةِ (أَيُّ عَدَدٍ).",s:"رواه الترمذي من حديث جابر، وصححه الألباني"},{t:"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ",c:100,v:"«من صلى علي صلاة صلى الله عليه بها عشرًا» — رواه مسلم",s:"الصلاة على النبي ﷺ — رواه مسلم"},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ، سُبْحَانَ اللَّهِ الْعَظِيمِ",c:100,v:"ثَقِيلَتَانِ فِي الْمِيزَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ (أَيُّ عَدَدٍ).",s:"متفق عليه من حديث أبي هريرة"},{t:"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.",c:100,v:'قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ‏"‏لَقَدْ رَأَيْتُ اثْنَيْ عَشَرَ مَلَكًا يَبْتَدِرُونَهَا، أَيُّهُمْ يَرْفَعُهَا"‏.',s:"رواه مسلم من حديث أنس"},{t:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ",c:100,v:"أَنَّهُنَّ أَحَبُّ الْكَلَامِ إِلَى اللَّهِ، وَمُكَفِّرَاتٌ لِلذُّنُوبِ، وَغَرْسُ الْجَنَّةِ، وَجُنَّةٌ لِقَائِلِهِنَّ مِنَ النَّارِ، وَأَحَبُّ إِلَى النَّبِيِّ عَلَيْهِ السَّلَامُ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمْسُ، وَالْبَاقِيَاتُ الصَّالِحَاتُ.",s:"«أحب الكلام إلى الله» رواه مسلم، وبقية الفضائل عند الترمذي وابن ماجه والنسائي بأسانيد حسنة"},{t:"اللَّهُ أَكْبَرُ كَبِيرًا ، وَالْحَمْدُ لِلَّهِ كَثِيرًا ، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا.",c:100,v:'قَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ "عَجِبْتُ لَهَا ، فُتِحَتْ لَهَا أَبْوَابُ السَّمَاءِ".',s:"رواه مسلم من حديث ابن عمر"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:100,v:"كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَتْ لَهُ مِئَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِئَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ.",s:"متفق عليه من حديث أبي هريرة"},{t:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.",c:100,v:"الْبَاقِيَاتُ الصَّالِحَاتُ وَكَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ.",s:"«كنز من كنوز الجنة» متفق عليه، و«الباقيات الصالحات» عند أحمد والنسائي في الكبرى"},{t:"سُبْحَانَ اللَّهِ ، وَالْحَمْدُ لِلَّهِ ، وَلَا إِلَهَ إِلَّا اللَّهُ ، وَاللَّهُ أَكْبَرُ ، اللَّهُمَّ اغْفِرْ لِي ، اللَّهُمَّ ارْحَمْنِي ، اللَّهُمَّ ارْزُقْنِي.",c:100,v:"خَيْرُ الدُّنْيَا وَالْآخِرَةِ",s:"رواه مسلم من حديث سعد بن أبي وقاص وطارق بن أشيم"},{t:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ , وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ , اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.",c:100,v:"فِي كُلِّ مَرَّةٍ تُحَطُّ عَنْهُ عَشْرُ خَطَايَا وَيُرْفَعُ لَهُ عَشْرُ دَرَجَاتٍ وَيُصَلِّي اللَّهُ عَلَيْهِ عَشْرًا وَتُعْرَضُ عَلَى الرَّسُولِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ (أَيُّ عَدَدٍ).",s:"الصلاة الإبراهيمية متفق عليها، والفضل رواه النسائي من حديث أنس، وصححه الألباني"}]},{k:"salah",ar:"أذكار الصلاة",en:"In the prayer",items:[{t:`اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ، بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ.
سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ.
الْحَمْدُ لِلَّهِ حَمْداً كَثِيراً طَيِّباً مُبَارَكاً فِيهِ.
اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا. أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ: مِنْ نَفْخِهِ، وَنَفْثِهِ، وَهَمْزِهِ.
اللَّهُمَّ رَبَّ جَبْرَائِيلَ، وَمِيكَائِيلَ، وَإِسْرَافِيلَ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اِهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُّسْتَقِيمٍ.
وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَوَاتِ وَالْأَرْضَ حَنِيفًا وَّمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي، وَنُسُكِي، وَمَحْيَايَ، وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ، اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ. وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالْخَيْرُ كُلُّهُ بِيَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.`,c:1,h:"أَدْعِيَةُ اسْتِفْتَاحِ الصَّلَاةِ",s:"متفق عليه، وبقية صيغ الاستفتاح عند مسلم وأهل السنن بأسانيد صحيحة"},{t:`سُبْحَانَ رَبِّيَ الْعَظِيمِ. ثَلَاثَ مَرَّاتٍ أَوْ أَكْثَرَ.
سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ. ثَلَاثَ مَرَّاتٍ.
سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.
سُبُّوحٌ، قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ.
سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ.
اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي وَبَصَرِي، وَمُخِّي وَعَظْمِي وَعَصَبِي.`,c:1,h:"أَدْعِيَةُ الرُّكُوعِ",s:"رواه مسلم وأهل السنن بأسانيد صحيحة"},{t:`سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.
رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.
اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي، و بَصَرِي، وَمُخِّي، وَعَظْمِي، وَعَصَبِي، وَمَا اسْتَقَلَّتْ بِهِ قَدَمِي لِلَّهِ رَبِّ الْعَالَمِينَ.
اللَّهُمَّ رَبَّنَا لَكَ الْحَمْدُ مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أَهْلَ الثَّنَاءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.
اللَّهُمَّ لَكَ الْحَمْدُ مِلْءَ السَّمَاءِ، وَمِلْءَ الْأَرْضِ، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، اللَّهُمَّ طَهِّرْنِي بِالثَّلْجِ وَالْبَرَدِ، وَالْمَاءِ الْبَارِدِ، اللَّهُمَّ طَهِّرْنِي مِنَ الذُّنُوبِ وَالْخَطَايَا، كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الْوَسَخِ.`,c:1,h:"أَدْعِيَةُ الرَّفْعِ مِنَ الرُّكُوعِ",s:"رواه البخاري ومسلم"},{t:`سُبْحَانَ رَبِّيَ الْأَعْلَى. ثَلَاثَ مَرَّاتٍ أَوْ أَكْثَرَ.
سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ. ثَلَاثَ مَرَّاتٍ.
سُبُّوحٌ قُدُّوسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوحِ.
سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.
سُبْحَانَ ذِي الْجَبْرُوتِ وَالْمَلَكُوتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ.
اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ.
اللَّهُمَّ لَكَ سَجَدْتُ وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ، وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.
رَبِّ أَعْطِ نَفْسِي تَقْوَاهَا زَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا أَنْتَ وَلِيُّهَا وَمَوْلَاهَا.
اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا وَاجْعَلْ فِي سَمْعِي نُورًا وَاجْعَلْ فِي بَصَرِي نُورًا وَاجْعَلْ مِنْ تَحْتِي نُورًا وَاجْعَلْ مِنْ فَوْقِي نُورًا وَعَنْ يَمِينِي نُورًا وَعَنْ يَسَارِي نُورًا وَاجْعَلْ أَمَامِي نُورًا وَاجْعَلْ خَلْفِي نُورًا وَأَعْظِمْ لِي نُورًا.`,c:1,h:"أَدْعِيَةُ السُّجُودِ",v:'بَعْدَ أَنْ يَخْتَارَ أَحَدَ أَدْعِيَةِ السُّجُودِ ، يُسَنُّ لَهُ أَنْ يَدْعُوَ بِمَا شَاءَ ،لِأَنَّ "أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ، فَأَكْثِرُوا الدُّعَاءَ".',s:"رواه مسلم وأهل السنن بأسانيد صحيحة"},{t:`رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي.
اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَاجْبُرْنِي، وَعَافِنِي، وَارْزُقْنِي، وَارْفَعْنِي.`,c:1,h:"أَدْعِيَةُ الْجُلُوسِ بَيْنَ السَّجْدَتَيْنِ",v:"كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُطِيلُ هَذَا الرُّكْنَ بِقَدْرِ السُّجُودِ.",s:"رواه أبو داود والترمذي وابن ماجه، وصححه الألباني"},{t:`سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، بِحَوْلِهِ وَقُوَّتِهِ، فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ.
اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْرًا، وَضَعْ عَنِّي بِهَا وِزْرًا، وَاجْعَلْهَا لِي عِنْدِكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.`,c:1,h:"دُعَاءُ سُجُودِ التِّلَاوَةِ",s:"رواه الترمذي وأحمد، وصححه الألباني"},{t:"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.",c:1,h:"التَّشَهُّدُ الْأَوَّلُ",v:"وَرَدَتْ صِيَغٌ أُخْرَى لِلتَّشَهُّدِ قَرِيبَةٌ مِنْ هَذَا.",s:"متفق عليه من حديث ابن مسعود"},{t:"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ. اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.",c:1,h:"التَّشَهُّدُ الْأَخِيرُ",s:"متفق عليه"},{t:`اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ. وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ. وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ.
اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْماً كَثِيراً ، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ. فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ. وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ. وَمَا أَسْرَفْتُ. وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي. أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ. لَا إِلَهَ إِلَّا أَنْتَ.
رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا اللَّهُ بِأَنَّكَ الْوَاحِدُ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ، أَنْ تَغْفِرَ لِي ذُنُوبِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.
اللَّهُمَّ حَاسِبْنِي حِسَابًا يَسِيراً.
اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، الْمَنَّانُ، يَا بَدِيعَ السَّمَوَاتِ وَالْأَرْضِ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.
اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.
اللَّهُمَّ بِعِلْمِكَ الْغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلْقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ، وَأَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ، وَلَا فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ.`,c:1,h:"أَدْعِيَةٌ بَعْدَ التَّشَهُّدِ الْأَخِيرِ وَقَبْلَ السَّلَامِ",s:"أدعية من الصحيحين والسنن بأسانيد صحيحة"},{t:`اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِي وَلَا يُقْضَى عَلَيْكَ، إِنَّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ وَأَعُوذُ بِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.
اللَّهُمَّ إِيَّاكَ نَعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، نَرْجُو رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالْكَافِرِينَ مُلْحِقٌ، اللَّهُمَّ إِنَّا نَسْتَعِينُكَ، وَنَسْتَغْفِرُكَ، وَنُثْنِي عَلَيْكَ الْخَيْرَ، وَلَا نَكْفُرُكَ، وَنُؤْمِنُ بِكَ وَنَخْضَعُ لَكَ، وَنَخْلَعُ مَنْ يَكْفُرُكَ.
اللَّهُمَّ تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ. وَصَلَّى اللَّهُ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمَ.`,c:1,h:"دُعَاءُ الْقُنُوتِ",v:"دُعَاءُ الْقُنُوتِ يَكُونُ فِي الرَّكْعَةِ الْأَخِيرَةِ مِنْ صَلَاةِ الْوِتْرِ بَعْدَ الرُّكُوعِ ، وَإِذَا جَعَلَهُ قَبْلَ الرُّكُوعِ فَلَا بَأْسَ ، إِلَّا أَنَّهُ بَعْدَ الرُّكُوعِ أَفْضَلُ ، وَيَرْفَعُ يَدَيْهِ إِلَى صَدْرِهِ وَلَا يَرْفَعُهَا كَثِيرًا . الْقُنُوتُ عِنْدَ النَّوَازِلِ سُنَّةٌ فِي جَمِيعِ الصَّلَوَاتِ الْخَمْسِ وَهُوَ فِي صَلَاةِ الْمَغْرِبِ وَالْفَجْرِ آكَدُ.",s:"رواه أبو داود والترمذي والنسائي من حديث الحسن بن علي، وصححه الألباني"},{t:`رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ وَأَصْلِحِ اللَّهُمَّ أَحْوَالَنَا فِي الْأُمُورِ كُلِّهَا وَبَلِّغْنَا بِمَا يُرْضِيكَ آمَالَنَا وَاخْتِمِ اللَّهُمَّ بِالصَّالِحَاتِ أَعْمَالَنَا وَبِالسَّعَادَةِ آجَالَنَا وَتَوَفَّنَا يَا رَبِّ وَأَنْتَ رَاضٍ عَنَّا.
اللَّهُمَّ اجْعَلْ جَمْعَنَا هَذَا جَمْعًا مُبَارَكًا مَرْحُومًا وَتَفَرُّقَنَا مِنْ كُلِّ شَرٍّ مَعْصُومًا.
رَبَّنَا لَا تَدَعْ لَنَا ذَنْبًا إِلَّا غَفَرْتَهُ وَلَا هَمًّا إِلَّا فَرَّجْتَهُ وَلَا مَرِيضًا إِلَّا شَفَيْتَهُ وَلَا مَيِّتًا إِلَّا رَحِمْتَهُ وَلَا طَالِبًا أَمْرًا مِنْ أُمُورِ الْخَيْرِ إِلَّا سَهَّلْتَهُ لَهُ وَيَسَّرْتَهُ.
اللَّهُمَّ وَحِّدْ كَلِمَةَ الْمُسْلِمِينَ وَاجْمَعْ شَمْلَهُمْ وَاجْعَلْهُمْ يَدًا وَاحِدَةً عَلَى مَنْ سِوَاهُمْ وَانْصُرِ اللَّهُمَّ الْمُسْلِمِينَ وَاخْذُلِ الْكَفَرَةَ الْمُشْرِكِينَ أَعْدَاءَكَ أَعْدَاءَ الدِّينِ.
اللَّهُمَّ إِنَّا نَسْأَلُكَ لِوُلَاةِ أُمُورِنَا الصَّلَاحَ وَالسَّدَادَ.
اللَّهُمَّ كُنْ لَهُمْ عَوْنًا وَخُذْ بِأَيْدِيهِمْ إِلَى الْحَقِّ وَالصَّوَابِ وَالسَّدَادِ وَالرَّشَادِ وَوَفِّقْهُمْ لِلْعَمَلِ لِمَا فِيهِ رِضَاكَ وَمَا فِيهِ صَالِحُ الْعِبَادِ وَالْبِلَادِ.
اللَّهُمَّ إِنَّا نَسْأَلُكَ لِبَلَدِنَا هَذَا اللَّهُمَّ اجْعَلْهُ بَلَدًا آمِنًا وَارْزُقْهُ مِنْ كُلِّ الْخَيْرَاتِ وَجَنِّبْهُ الْفِتَنَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَأَلِّفِ اللَّهُمَّ مَا بَيْنَ قُلُوبِنَا وَبَيْنَ قُلُوبِ أَبْنَاءِ هَذَا الْوَطَنِ وَاجْعَلْهُمُ اللَّهُمَّ يَا رَبَّنَا بِاسْمِكَ مُتَحَابِّينَ وَعَلَى
نُصْرَةِ دِينِكَ مُتَعَاوِنِينَ.
اللَّهُمَّ إِنَّا نَسْتَعِيذُ بِكَ مِنْ شَرِّ مَا خَلَقْتَ وَمِنْ كُلِّ عَيْنِ حَاسِدٍ و نَسْأَلُكَ اللَّهُمَّ التَّوْفِيقَ وَالسَّدَادَ وَالْهِدَايَةَ وَالرَّشَادَ وَحُسْنَ الْعُقْبَى وَحُسْنَ الْمِيعَادِ.
اللَّهُمَّ أَسْبِغْ عَلَيْنَا نِعْمَتَكَ وَعَلَى جَمِيعِ الْمُسْلِمِينَ وَامْلَأِ اللَّهُمَّ قُلُوبَنَا بِالْإِيمَانِ وَالْقَنَاعَةِ وَأَلْزِمْ جَوَارِحَنَا الْعِبَادَةَ وَالطَّاعَةَ وَاغْفِرِ اللَّهُمَّ لَنَا وَلِوَالِدَيْنَا وَلِإِخْوَانِنَا وَأَشْيَاخِنَا وَلِجَمِيعِ مَنْ سَبَقَنَا بِالْإِيمَانِ وَآتِنَا مِنْ لَدُنْكَ رَحْمَةً
وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا وَآتِنَا رَبَّنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.
سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ وَسَلَامٌ عَلَى الْمُرْسَلِينَ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ.`,c:1,h:"دُعَاءُ خُطْبَةِ الْجُمُعَةِ",s:"آيات من القرآن الكريم وأدعية عامة",f:"gen",w:"ليس دعاءً مأثورًا عن النبي ﷺ بهذا اللفظ مخصوصًا بالخطبة — أدعية عامة يختارها الخطيب"}]},{k:"sleep",ar:"أذكار النوم",en:"Before sleep",items:[{t:"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي ، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا ، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.",c:1,s:"متفق عليه من حديث أبي هريرة"},{t:"اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا لَكَ مَمَاتُهَا وَمَحْيَاهَا ، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا ، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا . اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ.",c:1,s:"رواه مسلم من حديث ابن عمر"},{t:"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.",c:3,s:"رواه أبو داود من حديث حفصة، وصححه الألباني"},{t:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.",c:1,s:"رواه البخاري من حديث حذيفة"},{t:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لَا كَافِيَ لَهُ وَلَا مُؤْوِيَ.",c:1,s:"رواه مسلم من حديث أنس"},{t:"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ .",c:1,s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ.",c:1,s:"متفق عليه من حديث البراء بن عازب"},{t:"سُبْحَانَ اللَّهِ.",c:33,s:"متفق عليه من حديث علي"},{t:"الْحَمْدُ لِلَّهِ.",c:33,s:"متفق عليه من حديث علي"},{t:"اللَّهُ أَكْبَرُ.",c:34,s:"متفق عليه من حديث علي"},{t:"يَجْمَعُ كَفَّيْهِ ثُمَّ يَنْفُثُ فِيهِمَا وَالْقِرَاءَةُ فِيهِمَا: {قُلْ هُوَ اللَّهُ أَحَدٌ} وَ{قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ} وَ{قُلْ أَعُوذُ بِرَبِّ النَّاسِ} وَمَسْحُ مَا اسْتَطَاعَ مِنَ الْجَسَدِ يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقْبَلَ مِنْ جَسَدِهِ.",c:3,s:"رواه البخاري من حديث عائشة"},{t:`سُورَةُ الْبَقَرَةِ: أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ. لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ.
[الْبَقَرَةُ 285 - 286]`,c:1,v:"مَنْ قَرَأَ آيَتَيْنِ مِنْ آخِرِ سُورَةِ الْبَقَرَةِ فِي لَيْلَةٍ كَفَتَاهُ.",s:"متفق عليه من حديث أبي مسعود الأنصاري"},{t:`آيَةُ الْكُرْسِيِّ: أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ. [الْبَقَرَةُ 255]`,c:1,v:"أُجِيرَ مِنَ الْجِنِّ حَتَّى يُصْبِحَ.",s:"رواه البخاري من حديث أبي هريرة"},{t:`عَنْ بُرَيْدَةَ رَضِيَ اللَّهُ عَنْهُ، قَالَ: شَكَا خَالِدُ بْنُ الْوَلِيدِ رَضِيَ اللَّهُ عَنْهُ إِلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فَقَالَ: يَا رَسُولَ اللَّهِ! مَا أَنَامُ اللَّيْلَ مِنَ الْأَرَقِ، فَقَالَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: "إِذَا أَوَيْتَ إِلَى فِرَاشِكَ فَقُلْ: اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَمَا أَظَلَّتْ، وَرَبَّ الْأَرَضِينَ وَمَا أَقَلَّتْ، وَرَبَّ الشَّيَاطِينِ وَمَا أَضَلَّتْ، كُنْ لِي جَارًا مِنْ خَلْقِكَ كُلِّهِمْ جَمِيعًا أَنْ يَفْرُطَ عَلَيَّ أَحَدٌ مِنْهُمْ أَوْ أَنْ يَبْغِيَ عَلَيَّ، عَزَّ جَارُكَ، وَجَلَّ ثَنَاؤُكَ وَلَا إِلَهَ غَيْرُكَ، وَلَا إِلَهَ إِلَّا أَنْتَ"
عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ: أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ كَانَ يُعَلِّمُهُمْ مِنَ الْفَزَعِ كَلِمَاتٍ: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ غَضَبِهِ وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ"`,c:1,h:"أَذْكَارُ مَنْ قَلِقَ فِي فِرَاشِهِ وَلَمْ يَنَمْ",s:"الترمذي (حديث بريدة) — أبو داود والترمذي (حديث عمرو بن شعيب)",f:"weak",w:"حديث بريدة في أوله ضعيف جدًا — ضعّفه الألباني؛ أما «أعوذ بكلمات الله التامة من غضبه…» فحسن (أبو داود والترمذي)"},{t:'عَنْ أَبِي قَتَادَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: "الرُّؤْيَا الصَّالِحَةُ" وَفِي رِوَايَةٍ "الرُّؤْيَا الْحَسَنَةُ مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ، فَمَنْ رَأَى شَيْئًا يَكْرَهُهُ فَلْيَنْفُثْ عَنْ شِمَالِهِ ثَلَاثًا وَلْيَتَعَوَّذْ مِنَ الشَّيْطَانِ، فَإِنَّهَا لَا تَضُرُّهُ".',c:1,h:"أَذْكَارُ الْأَحْلَامِ",s:"متفق عليه من حديث أبي قتادة"}]},{k:"wake",ar:"أذكار الاستيقاظ",en:"On waking",items:[{t:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.",c:1,s:"رواه البخاري من حديث حذيفة"},{t:"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي وَرَدَّ عَلَيَّ رُوحِي وَأَذِنَ لِي بِذِكْرِهِ.",c:1,s:"رواه الترمذي من حديث أبي هريرة، وحسّنه الألباني"},{t:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ ، وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ. رَبِّ اغْفِرْ لِي.",c:1,s:"رواه البخاري من حديث عبادة بن الصامت، و«رب اغفر لي» لفظ ابن ماجه"}]},{k:"wudu",ar:"أذكار الوضوء",en:"Wudu",items:[{t:'قَبْلَ الْوُضُوءِ: "بِسْمِ اللَّهِ".',c:1,h:"الذِّكْرُ قَبْلَ الْوُضُوءِ",s:"رواه أبو داود وابن ماجه، وصححه الألباني"},{t:`"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ".
"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ".
"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ".`,c:1,h:"الذِّكْرُ بَعْدَ الْوُضُوءِ",s:"رواه مسلم، والترمذي («اللهم اجعلني من التوابين…»)، والنسائي في عمل اليوم والليلة («سبحانك اللهم وبحمدك…»)، وصححه الألباني"}]},{k:"home",ar:"أذكار المنزل",en:"Home",items:[{t:"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا.",c:1,h:"أَذْكَارُ الدُّخُولِ إِلَى الْمَنْزِلِ",s:"رواه أبو داود",f:"disp",w:"مختلف في ثبوته: حسّنه بعض العلماء وضعّفه الألباني. والثابت: التسمية عند دخول البيت والسلام على أهله (مسلم)"},{t:`بِسْمِ اللَّهِ ، تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ ، أَوْ أَزِلَّ أَوْ أُزَلَّ ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.`,c:1,h:"أَذْكَارُ الْخُرُوجِ مِنَ الْمَنْزِلِ",s:"رواه أبو داود والترمذي، وصححه الألباني"}]},{k:"khala",ar:"أذكار الخلاء",en:"Restroom",items:[{t:"(بِسْمِ اللَّهِ) اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ.",c:1,h:"الذِّكْرُ عِنْدَ الْخَلَاءِ",s:"متفق عليه، والتسمية عند الترمذي وسعيد بن منصور، وصححه الألباني"},{t:"غُفْرَانَكَ.",c:1,h:"الذِّكْرُ بَعْدَ الْخُرُوجِ مِنَ الْخَلَاءِ",s:"رواه أبو داود والترمذي وابن ماجه، وصححه الألباني"}]},{k:"food",ar:"أذكار الطعام",en:"Food",items:[{t:`بِسْمِ اللَّهِ.
فَإِنْ نَسِيَ فِي أَوَّلِهِ، فَلْيَقُلْ:
بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ.`,c:1,h:"الذِّكْرُ عِنْدَ الطَّعَامِ وَالشَّرَابِ",s:"رواه أبو داود والترمذي من حديث عائشة، وصححه الألباني"},{t:"اللَّهُمَّ بَارِكْ لَنَا فِيهِ, وَزِدْنَا مِنْهُ.",c:1,h:"الذِّكْرُ عِنْدَ شُرْبِ اللَّبَنِ",s:"رواه أبو داود والترمذي من حديث ابن عباس، وحسّنه الألباني"},{t:`الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا, وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.
الْحَمْدُ لِلَّهِ كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا.`,c:1,h:"الذِّكْرُ عِنْدَ الْفَرَاغِ مِنَ الطَّعَامِ وَالشَّرَابِ",v:"غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ.",s:"الأول رواه أبو داود والترمذي وابن ماجه، وحسّنه الألباني؛ والثاني رواه البخاري"},{t:"أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ ، وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ.",c:1,h:"أَذْكَارُ الضَّيْفِ",s:"رواه أبو داود وأحمد من حديث أنس، وصححه الألباني"},{t:"كَانَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَشْرَبُ فِي ثَلَاثَةِ أَنْفَاسٍ، إِذَا أَدْنَى الْإِنَاءَ إِلَى فَمِهِ سَمَّى اللَّهَ تَعَالَى, وَإِذَا أَخَّرَهُ حَمِدَ اللَّهَ تَعَالَى، يَفْعَلُ ذَلِكَ ثَلَاثَ مَرَّاتٍ.",c:1,h:"هَدْيُ النَّبِيِّ فِي الشُّرْبِ",s:"الشرب في ثلاثة أنفاس متفق عليه، والتسمية والحمد عند الطبراني في الأوسط، وحسّنه الألباني (السلسلة الصحيحة 1277)"}]},{k:"misc",ar:"أذكار متفرقة",en:"Various",items:[{t:"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا (الثَّوْبَ) وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.",c:1,h:"دُعَاءُ لُبْسِ الثَّوْبِ",s:"رواه أبو داود والترمذي، وحسّنه الألباني"},{t:"اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ",c:1,h:"دُعَاءُ لُبْسِ الثَّوْبِ الْجَدِيدِ",s:"رواه أبو داود والترمذي من حديث أبي سعيد، وصححه الألباني"},{t:`لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ، وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ
اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ وَأَصْلِحْ لِي شَأْنِي كُلَّهُ ، لَا إِلَهَ إِلَّا أَنْتَ
لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ
اللَّهُ اللَّهُ رَبِّي لَا أُشْرِكُ بِهِ شَيْئًا`,c:1,h:"دُعَاءُ الْكَرْبِ",s:"الأول متفق عليه، والبقية عند أبي داود والترمذي بأسانيد صحيحة وحسنة"},{t:`اللَّهُمَّ إِنِّي عَبْدُكَ ابْنُ عَبْدِكَ ابْنُ أَمَتِكَ نَاصِيَتِي بِيَدِكَ مَاضٍ فِيَّ حُكْمُكَ ، عَدْلٌ فِيَّ قَضَاؤُكَ أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ سَمَّيْتَ بِهِ نَفْسَكَ أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي ، وَنُورَ صَدْرِي وَجَلَاءَ حُزْنِي وَذَهَابَ هَمِّي.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.`,c:1,h:"دُعَاءُ الْهَمِّ وَالْحَزَنِ",s:"رواه أحمد من حديث ابن مسعود، وصححه الألباني (السلسلة الصحيحة 199)"},{t:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ",c:1,h:"دُعَاءُ قَضَاءِ الدَّيْنِ",s:"رواه الترمذي من حديث علي، وحسّنه الألباني"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا فِيهَا، وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ.",c:1,h:"دُعَاءُ الرِّيحِ",s:"رواه مسلم من حديث عائشة"},{t:"سُبْحَانَ اللَّهِ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ",c:1,h:"دُعَاءُ الرَّعْدِ",s:"رواه مالك في الموطأ والبخاري في الأدب المفرد موقوفًا على عبد الله بن الزبير، وصحح إسناده الألباني",f:"athar",w:"أثر عن الصحابي (موقوف)، وليس حديثًا مرفوعًا"},{t:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ وَيَرْحَمُ اللَّهُ الْمُسْتَقْدِمِينَ مِنَّا وَالْمُسْتَأْخِرِينَ، أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ.",c:1,h:"دُعَاءُ زِيَارَةِ الْقُبُورِ",s:"رواه مسلم من حديث بريدة وعائشة"},{t:"اللَّهُمَّ صَيِّبًا نَافِعًا",c:1,h:"دُعَاءُ نُزُولِ الْمَطَرِ",s:"رواه البخاري من حديث عائشة"},{t:"بِسْمِ اللَّهِ ، الْحَمْدُ لِلَّهِ ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، الْحَمْدُ لِلَّهِ ، الْحَمْدُ لِلَّهِ ، الْحَمْدُ لِلَّهِ ، اللَّهُ أَكْبَرُ ، اللَّهُ أَكْبَرُ ، اللَّهُ أَكْبَرُ ، سُبْحَانَكَ اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي ، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",c:1,h:"دُعَاءُ رُكُوبِ الدَّابَّةِ أَوْ مَا يَقُومُ مَقَامَهَا ( السَّيَّارَةِ أَوِ الْقِطَارِ أَوِ الطَّائِرَةِ أَوِ السَّفِينَةِ)",s:"رواه أبو داود والترمذي من حديث علي، وصححه الألباني"},{t:`اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى ، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ وَكَآبَةِ الْمَنْظَرِ وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ.
وَإِذَا رَجَعَ قَالَهُنَّ وَزَادَ فِيهِنَّ ـ" آيِبُونَ ،تَائِبُونَ، عَابِدُونَ ، لِرَبِّنَا حَامِدُونَ"`,c:1,h:"دُعَاءُ السَّفَرِ",s:"رواه مسلم من حديث ابن عمر"},{t:"أَسْتَوْدِعُكُمُ اللَّهَ الَّذِي لَا تَضِيعُ وَدَائِعُهُ",c:1,h:"دُعَاءُ الْمُسَافِرِ لِلْمُقِيمِ",s:"رواه أحمد وابن ماجه من حديث أبي هريرة، وصححه الألباني"},{t:"أَسْتَوْدِعُ اللَّهَ دِينَكَ وَأَمَانَتَكَ ، وَخَوَاتِيمَ عَمَلِكَ زَوَّدَكَ اللَّهُ التَّقْوَى، وَغَفَرَ ذَنْبَكَ، وَيَسَّرَ لَكَ الْخَيْرَ حَيْثُ مَا كُنْتَ",c:1,h:"دُعَاءُ الْمُقِيمِ لِلْمُسَافِرِ",s:"رواه الترمذي وأحمد، وصححه الألباني"},{t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",c:1,h:"دُعَاءُ النُّزُولِ فِي مَكَانٍ",s:"رواه مسلم من حديث خولة بنت حكيم"},{t:"رَبِّ اغْفِرْ لِي رَبِّ اغْفِرْ لِي اللَّهُمَّ اغْفِرْ لِي ، وَارْحَمْنِي وَاهْدِنِي وَاجْبُرْنِي وَعَافِنِي وَارْزُقْنِي وَارْفَعْنِي",c:1,h:"الدُّعَاءُ بَيْنَ السَّجْدَتَيْنِ",s:"رواه أبو داود والترمذي وابن ماجه، وصححه الألباني"},{t:"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا",c:1,h:"دُعَاءُ مَنِ اسْتَصْعَبَ عَلَيْهِ أَمْرٌ",s:"رواه ابن حبان في صحيحه وابن السني من حديث أنس"},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ",c:1,h:"دُعَاءُ الْخَوْفِ مِنَ الشِّرْكِ",s:"رواه أحمد والبخاري في الأدب المفرد، وصححه الألباني"},{t:"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الْغَفُورُ (100 مَرَّةٍ قَبْلَ أَنْ يَقُومَ)",c:100,h:"مَا يُقَالُ فِي الْمَجْلِسِ",s:"رواه أبو داود والترمذي من حديث ابن عمر، وصححه الألباني"},{t:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",c:1,h:"كَفَّارَةُ الْمَجْلِسِ",s:"رواه أبو داود والترمذي، وصححه الألباني"},{t:"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاهُ بِهِ وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا",c:1,h:"دُعَاءُ مَنْ رَأَى مُبْتَلًى",s:"رواه الترمذي، وحسّنه الألباني"},{t:"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",c:1,h:"دُعَاءُ الْغَضَبِ",s:"متفق عليه من حديث سليمان بن صُرَد"},{t:"بَارَكَ اللَّهُ لَكَ ، وَبَارَكَ عَلَيْكَ ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ",c:1,h:"الدُّعَاءُ لِلْمُتَزَوِّجِ",s:"رواه أبو داود والترمذي من حديث أبي هريرة، وصححه الألباني"},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا جَبَلْتَهَا عَلَيْهِ ، وَإِذَا اشْتَرَى بَعِيرًا فَلْيَأْخُذْ بِذُرْوَةِ سَنَامِهِ وَلْيَقُلْ مِثْلَ ذَلِكَ",c:1,h:"دُعَاءُ الْمُتَزَوِّجِ لِنَفْسِهِ",s:"رواه أبو داود وابن ماجه، وحسّنه الألباني"},{t:"بِسْمِ اللَّهِ ـ اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا",c:1,h:"الدُّعَاءُ قَبْلَ الْجِمَاعِ",s:"متفق عليه من حديث ابن عباس"},{t:"إِذَا عَطَسَ أَحَدُكُمْ فَلْيَقُلْ : الْحَمْدُ لِلَّهِ ، وَلْيَقُلْ لَهُ أَخُوهُ ، أَوْ صَاحِبُهُ : يَرْحَمُكَ اللَّهُ فَإِذَا قَالَ لَهُ : يَرْحَمُكَ اللَّهُ ، فَلْيَقُلْ : يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.",c:1,h:"دُعَاءُ الْعُطَاسِ",s:"رواه البخاري من حديث أبي هريرة"},{t:"ذَهَبَ الظَّمَأُ ، وَابْتَلَّتِ الْعُرُوقُ ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ",c:1,h:"الدُّعَاءُ عِنْدَ إِفْطَارِ الصَّائِمِ",s:"رواه أبو داود من حديث ابن عمر، وحسّنه الألباني"},{t:"أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ ، وَصَلَّتْ عَلَيْكُمُ الْمَلَائِكَةُ",c:1,h:"الدُّعَاءُ إِذَا أَفْطَرَ عِنْدَ أَهْلِ بَيْتٍ",s:"رواه أبو داود وأحمد من حديث أنس، وصححه الألباني"},{t:"اللَّهُ أَكْبَرُ ، اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْأَمْنِ ، وَالْإِيمَانِ وَالسَّلَامَةِ ، وَالْإِسْلَامِ ، وَالتَّوْفِيقِ لِمَا تُحِبُّ وَتَرْضَى رَبُّنَا وَرَبُّكَ اللَّهُ.",c:1,h:"دُعَاءُ رُؤْيَةِ الْهِلَالِ",s:"رواه الترمذي والدارمي، وصححه الألباني"},{t:"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْرًا مِنْهَا",c:1,h:"دُعَاءُ مَنْ أُصِيبَ بِمُصِيبَةٍ",s:"رواه مسلم من حديث أم سلمة"},{t:"لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ مَا مِنْ عَبْدٍ مُسْلِمٍ يَعُودُ مَرِيضًا لَمْ يَحْضُرْ أَجَلُهُ فَيَقُولُ سَبْعَ مَرَّاتٍ : أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ إِلَّا عُوفِيَ.",c:1,h:"الدُّعَاءُ لِلْمَرِيضِ فِي عِيَادَتِهِ",s:"«لا بأس طهور» رواه البخاري، والدعاء سبعًا رواه أبو داود والترمذي، وصححه الألباني"},{t:"اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَأَلْحِقْنِي بِالرَّفِيقِ الْأَعْلَى",c:1,h:"دُعَاءُ الْمَرِيضِ الَّذِي يَئِسَ مِنْ حَيَاتِهِ",s:"متفق عليه من حديث عائشة"},{t:"أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",c:1,h:"مَا يُعَوَّذُ بِهِ الْأَوْلَادُ",s:"رواه البخاري من حديث ابن عباس"},{t:`حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ
اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ
اللَّهُمَّ أَنْتَ عَضُدِي ، وَأَنْتَ نَصِيرِي ، بِكَ أَجُولُ وَبِكَ أَصُولُ وَبِكَ أُقَاتِلُ`,c:1,h:"دُعَاءُ لِقَاءِ الْعَدُوِّ وَذِي السُّلْطَانِ",s:"«حسبنا الله ونعم الوكيل» رواه البخاري، والبقية رواها أبو داود والترمذي، وصححه الألباني"},{t:"قَالَ جَابِرُ بْنُ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا : كَانَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يُعَلِّمُنَا الِاسْتِخَارَةَ فِي الْأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ ، يَقُولُ : ( إِذَا هَمَّ أَحَدُكُمْ بِالْأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ ثُمَّ لْيَقُلْ : اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ وَتَعْلَمُ وَلَا أَعْلَمُ وَأَنْتَ عَلَّامُ الْغُيُوبِ ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ ـ وَيُسَمِّي حَاجَتَهُ ـ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي ـ أَوْ قَالَ عَاجِلِهِ وَآجِلِهِ ـ فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثُمَّ بَارِكْ لِي فِيهِ ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي ـ أَوْ قَالَ عَاجِلِهِ وَآجِلِهِ ـ فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ وَاقْدُرْ لِي الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِي بِهِ).",c:1,h:"دُعَاءُ صَلَاةِ الِاسْتِخَارَةِ",s:"رواه البخاري من حديث جابر"},{t:"سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ ،وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ ( فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ )",c:1,h:"دُعَاءُ سُجُودِ التِّلَاوَةِ",s:"رواه الترمذي وأحمد، وصححه الألباني، و«فتبارك الله أحسن الخالقين» عند الحاكم"},{t:`اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْغَرْبِ ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ.
سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالَى جَدُّكَ وَلَا إِلَهَ غَيْرُكَ.
اللَّهُ أَكْبَرُ كَبِيرًا ، اللَّهُ أَكْبَرُ كَبِيرًا ، اللَّهُ أَكْبَرُ كَبِيرًا ، وَالْحَمْدُ لِلَّهِ كَثِيرًا ، وَالْحَمْدُ لِلَّهِ كَثِيرًا ، وَالْحَمْدُ لِلَّهِ كَثِيرًا ، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا(ثَلَاثًا) ـ "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ مِنْ نَفْخِهِ وَنَفْثِهِ وَهَمْزِهِ ".`,c:1,h:"دُعَاءُ الِاسْتِفْتَاحِ",s:"متفق عليه، و«سبحانك اللهم وبحمدك…» عند أهل السنن، وصححه الألباني"},{t:`لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لَا يَمُوتُ بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ وَرَفَعَ لَهُ أَلْفَ أَلْفِ دَرَجَةٍ وَفِي رِوَايَةٍ: وَبَنَى لَهُ بَيْتًا فِي الْجَنَّةِ).
بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ السُّوقِ، وَخَيْرَ مَا فِيهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُصِيبَ بِهَا يَمِينًا فَاجِرَةً، أَوْ صَفْقَةً خَاسِرَةً.`,c:1,h:"دُعَاءُ دُخُولِ السُّوقِ",s:"رواه الترمذي وابن ماجه، وحسّنه الألباني"},{t:"كَمَا أَخْبَرَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ ((مَا مِنْ عَبْدٍ يُذْنِبُ ذَنْبًا فَيَتَوَضَّأُ فَيُحْسِنُ الطُّهُورَ،ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ ، ثُمَّ يَسْتَغْفِرُ اللَّهَ لِذَلِكَ الذَّنْبِ إِلَّا غُفِرَ لَهُ )).",c:1,h:"عِنْدَ فِعْلِ الذَّنْبِ أَوِ ارْتِكَابِ الْمَعْصِيَةِ",s:"رواه أبو داود والترمذي من حديث أبي بكر الصديق، وصححه الألباني"},{t:`الدُّعَاءُ عِنْدَ صِيَاحِ الدِّيكِ : (( اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ )). ((إِذَا سَمِعْتُمْ صِيَاحَ الدِّيكِ[مِنَ اللَّيْلِ]،فَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ فَإِنَّهَا رَأَتْ مَلَكًا وَإِذَا سَمِعْتُمْ نَهِيقَ الْحِمَارِ،فَتَعَوَّذُوا بِاللَّهِ مِنَ الشَّيْطَانِ فَإِنَّهَا رَأَتْ شَيْطَانًا)). مُتَّفَقٌ عَلَيْهِ.
الدُّعَاءُ عِنْدَ صِيَاحِ الدِّيكِ وَنَهِيقِ الْحِمَارِ وَنُبَاحِ الْكِلَابِ: (( أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ )).
((إِذَا سَمِعْتُمْ نُبَاحَ الْكِلَابِ وَنَهِيقَ الْحَمِيرِ بِاللَّيْلِ فَتَعَوَّذُوا بِاللَّهِ فَإِنَّهُنَّ يَرَيْنَ مَا لَا تَرَوْنَ)). صَحِيحٌ(صَحِيحُ سُنَنِ أَبِي دَاوُدَ3/961)`,c:1,h:"الدُّعَاءُ عِنْدَ سَمَاعِ أَصْوَاتِ الْحَيَوَانَاتِ",s:"متفق عليه، ونباح الكلاب عند أبي داود، وصححه الألباني"},{t:`اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي ، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.
عَنْ شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللَّهُ عَنْهُ عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ ( سَيِّدُ الِاسْتِغْفَارِ أَنْ يَقُولَ الْعَبْدُ اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ ، خَلَقْتَنِي وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي ، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ ) مَنْ قَالَهَا فِي النَّهَارِ مُوقِنًا بِهَا فَمَاتَ مِنْ يَوْمِهِ قَبْلَ أَنْ يُمْسِيَ فَهُوَ مِنْ أَهْلِ الْجَنَّةِ وَمَنْ قَالَهَا مِنَ اللَّيْلِ وَهُوَ مُوقِنٌ بِهَا فَمَاتَ قَبْلَ أَنْ يُصْبِحَ فَهُوَ مِنْ أَهْلِ الْجَنَّةِ . أَخْرَجَهُ الْبُخَارِيُّ.`,c:1,h:"سَيِّدُ الِاسْتِغْفَارِ",s:"رواه البخاري من حديث شداد بن أوس"},{t:"ضَعْ يَدَكَ عَلَى الَّذِي تَأَلَّمَ مِنْ جَسَدِكَ وَقُلْ: بِسْمِ اللَّهِ ،ثَلَاثًا ،وَقُلْ سَبْعَ مَرَّاتٍ: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ.",c:1,h:"الدُّعَاءُ إِذَا أَحْسَسْتَ بِوَجَعٍ فِي جَسَدِكَ",s:"رواه مسلم من حديث عثمان بن أبي العاص"},{t:"مَا مِنْ عَبْدٍ يُذْنِبُ ذَنْبًا فَيُحْسِنُ الطُّهُورَ ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ ، ثُمَّ يَسْتَغْفِرُ اللَّهَ إِلَّا غُفِرَ لَهُ",c:1,h:"مَا يَقُولُ وَيَفْعَلُ مَنْ أَذْنَبَ ذَنْبًا",s:"رواه أبو داود والترمذي من حديث أبي بكر الصديق، وصححه الألباني"}]},{k:"nabawi",ar:"أدعية نبوية",en:"Prophetic duas",items:[{t:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6306) عَنْ شَدَّادِ بْنِ أَوْسٍ وَقَدْ وَصَفَ النَّبِيُّ هَذَا الدُّعَاءَ بِأَنَّهُ سَيِّدُ الِاسْتِغْفَارِ."},{t:"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (834) وَمُسْلِمٌ (6869) عَنْ أَبِي بَكْرٍ."},{t:"رَبِّ اغْفِرْ لِي خَطِيئَتِي وَجَهْلِي وَإِسْرَافِي فِي أَمْرِي كُلِّهِ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، اللَّهُمَّ اغْفِرْ لِي خَطَايَايَ وَعَمْدِي وَجَهْلِي وَهَزْلِي، وَكُلُّ ذَلِكَ عِنْدِي، اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ وَأَنْتَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6398) وَمُسْلِمٌ (6901) عَنْ أَبِي مُوسَى."},{t:"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ، وَجِلَّهُ، وَأَوَّلَهُ، وَآخِرَهُ، وَعَلَانِيَتَهُ، وَسِرَّهُ.",c:1,s:"رَوَاهُ مُسْلِمٌ (1084) عَنْ أَبِي هُرَيْرَةَ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْجُبْنِ وَالْبُخْلِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6369) عَنْ أَنَسٍ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6365) عَنْ سَعْدِ بْنِ أَبِي وَقَّاصٍ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكَسَلِ وَالْهَرَمِ وَالْمَأْثَمِ وَالْمَغْرَمِ، وَمِنْ فِتْنَةِ الْقَبْرِ وَعَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ، وَمِنْ شَرِّ فِتْنَةِ الْغِنَى، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْفَقْرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، اللَّهُمَّ اغْسِلْ عَنِّي خَطَايَايَ بِمَاءِ الثَّلْجِ وَالْبَرَدِ، وَنَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ، وَبَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6368) وَمُسْلِمٌ (6871) عَنْ عَائِشَةَ."},{t:"اللَّهُمَّ رَبَّ السَّمَوَاتِ وَرَبَّ الْأَرْضِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ.",c:1,s:"رَوَاهُ مُسْلِمٌ (6889) عَنْ أَبِي هُرَيْرَةَ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ وَمِنْ شَرِّ مَا لَمْ أَعْمَلْ.",c:1,s:"رَوَاهُ مُسْلِمٌ (6895) عَنْ عَائِشَةَ."},{t:"اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ.",c:1,s:"رَوَاهُ مُسْلِمٌ (6903) عَنْ أَبِي هُرَيْرَةَ."},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى.",c:1,s:"رَوَاهُ مُسْلِمٌ (6904) عَنِ ابْنِ مَسْعُودٍ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ، وَالْهَرَمِ وَعَذَابِ الْقَبْرِ، اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا.",c:1,s:"رَوَاهُ مُسْلِمٌ (6906) عَنْ زَيْدِ بْنِ أَرْقَمَ."},{t:"اللَّهُمَّ لَكَ أَسْلَمْتُ وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ وَإِلَيْكَ أَنَبْتُ وَبِكَ خَاصَمْتُ، اللَّهُمَّ إِنِّي أَعُوذُ بِعِزَّتِكَ لَا إِلَهَ إِلَّا أَنْتَ أَنْ تُضِلَّنِي، أَنْتَ الْحَيُّ الَّذِي لَا يَمُوتُ وَالْجِنُّ وَالْإِنْسُ يَمُوتُونَ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (7383) وَمُسْلِمٌ (6899) عَنِ ابْنِ عَبَّاسٍ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ وَفُجَاءَةِ نِقْمَتِكَ وَجَمِيعِ سَخَطِكَ.",c:1,s:"رَوَاهُ مُسْلِمٌ (6943) عَنِ ابْنِ عُمَرَ."},{t:"اللَّهُمَّ مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ.",c:1,s:"رَوَاهُ مُسْلِمٌ (6750) عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو."},{t:"اللَّهُمَّ رَبَّ جَبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ.",c:1,s:"رَوَاهُ مُسْلِمٌ (1811) عَنْ عَائِشَةَ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.",c:1,s:"رَوَاهُ مُسْلِمٌ (1090) عَنْ عَائِشَةَ."},{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَهْدِ الْبَلَاءِ وَدَرَكِ الشَّقَاءِ وَسُوءِ الْقَضَاءِ وَشَمَاتَةِ الْأَعْدَاءِ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6347) وَمُسْلِمٌ (6877) عَنْ أَبِي هُرَيْرَةَ."},{t:"اللَّهُمَّ اجْعَلْ لِي فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَفِي سَمْعِي نُورًا، وَفِي بَصَرِي نُورًا، وَمِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَمِنْ بَيْنِ يَدَيَّ نُورًا، وَمِنْ خَلْفِي نُورًا، وَاجْعَلْ فِي نَفْسِي نُورًا، وَأَعْظِمْ لِي نُورًا.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (6316) وَمُسْلِمٌ (1797) عَنِ ابْنِ عَبَّاسٍ."},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ عَاجِلِهِ وَآجِلِهِ مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَعُوذُ بِكَ مِنَ الشَّرِّ كُلِّهِ عَاجِلِهِ وَآجِلِهِ مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَنَبِيُّكَ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا عَاذَ بِهِ عَبْدُكَ وَنَبِيُّكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِي خَيْرًا.",c:1,s:"رَوَاهُ ابْنُ مَاجَهْ (3846) بِإِسْنَادٍ صَحِيحٍ عَنْ عَائِشَةَ."},{t:"اللَّهُمَّ بِعِلْمِكَ الْغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلْقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي، اللَّهُمَّ وَأَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْفَقْرِ وَالْغِنَى، وَأَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَاءَ بَعْدَ الْقَضَاءِ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ وَالشَّوْقَ إِلَى لِقَائِكَ فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ وَلَا فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ.",c:1,s:"رَوَاهُ النَّسَائِيُّ (1305) بِإِسْنَادٍ حَسَنٍ عَنْ عَمَّارِ بْنِ يَاسِرٍ."},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، وَاحْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.",c:1,s:"رَوَاهُ أَبُو دَاوُدَ (5074) وَغَيْرُهُ بِإِسْنَادٍ صَحِيحٍ عَنِ ابْنِ عُمَرَ."},{t:"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَشَرِّ الشَّيْطَانِ وَشِرْكِهِ.",c:1,s:"رَوَاهُ التِّرْمِذِيُّ (3392) وَغَيْرُهُ بِإِسْنَادٍ صَحِيحٍ عَنْ أَبِي هُرَيْرَةَ."},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ، وَأَسْأَلُكَ قَلْبًا سَلِيمًا، وَلِسَانًا صَادِقًا، وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا تَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ.",c:1,s:'رَوَاهُ الطَّبَرَانِيُّ فِي "الْكَبِيرِ" (7135) عَنْ شَدَّادِ بْنِ أَوْسٍ.',f:"disp",w:"مختلف في ثبوته: في إسناده مقال، وصححه بعضهم بمجموع طرقه"},{t:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.",c:1,s:"رَوَاهُ التِّرْمِذِيُّ (3563) بِإِسْنَادٍ حَسَنٍ عَنْ عَلِيٍّ."},{t:"اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.",c:1,s:"رَوَاهُ أَبُو دَاوُدَ (5090) بِإِسْنَادٍ حَسَنٍ عَنْ أَبِي بَكْرَةَ."},{t:"رَبِّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ، وَاهْدِنِي وَيَسِّرِ الْهُدَى لِي، وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَيَّ، رَبِّ اجْعَلْنِي لَكَ شَكَّارًا، لَكَ ذَكَّارًا، لَكَ رَهَّابًا، لَكَ مِطْوَاعًا، لَكَ مُخْبِتًا إِلَيْكَ أَوَّاهًا مُنِيبًا، رَبِّ تَقَبَّلْ تَوْبَتِي وَاغْسِلْ حَوْبَتِي وَأَجِبْ دَعْوَتِي وَثَبِّتْ حُجَّتِي وَسَدِّدْ لِسَانِي وَاهْدِ قَلْبِي وَاسْلُلْ سَخِيمَةَ صَدْرِي.",c:1,s:"رَوَاهُ التِّرْمِذِيُّ (3551) وَغَيْرُهُ بِإِسْنَادٍ صَحِيحٍ عَنِ ابْنِ عَبَّاسٍ."},{t:"اللَّهُمَّ لَكَ الْحَمْدُ كُلُّهُ، اللَّهُمَّ لَا قَابِضَ لِمَا بَسَطْتَ، وَلَا بَاسِطَ لِمَا قَبَضْتَ، وَلَا هَادِيَ لِمَا أَضْلَلْتَ، وَلَا مُضِلَّ لِمَنْ هَدَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُقَرِّبَ لِمَا بَاعَدْتَ، وَلَا مُبَاعِدَ لِمَا قَرَّبْتَ، اللَّهُمَّ ابْسُطْ عَلَيْنَا مِنْ بَرَكَاتِكَ وَرَحْمَتِكَ وَفَضْلِكَ وَرِزْقِكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ الْمُقِيمَ الَّذِي لَا يَحُولُ وَلَا يَزُولُ، اللَّهُمَّ إِنِّي أَسْأَلُكَ النَّعِيمَ يَوْمَ الْعَيْلَةِ، وَالْأَمْنَ يَوْمَ الْخَوْفِ، اللَّهُمَّ إِنِّي عَائِذٌ بِكَ مِنْ شَرِّ مَا أَعْطَيْتَنَا وَشَرِّ مَا مَنَعْتَ، اللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا، وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ، اللَّهُمَّ تَوَفَّنَا مُسْلِمِينَ، وَأَحْيِنَا مُسْلِمِينَ، وَأَلْحِقْنَا بِالصَّالِحِينَ غَيْرَ خَزَايَا وَلَا مَفْتُونِينَ، اللَّهُمَّ قَاتِلْ الْكَفَرَةَ الَّذِينَ يُكَذِّبُونَ رُسُلَكَ، وَيَصُدُّونَ عَنْ سَبِيلِكَ، وَاجْعَلْ عَلَيْهِمْ رِجْزَكَ وَعَذَابَكَ، اللَّهُمَّ قَاتِلْ الْكَفَرَةَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَهَ الْحَقِّ.",c:1,s:"رَوَاهُ الْإِمَامُ أَحْمَدُ (15492) عَنْ رِفَاعَةَ الزُّرَقِيِّ بِإِسْنَادٍ صَحِيحٍ.",f:"disp",w:"مختلف في ثبوته: صححه الحاكم، وضعّف إسناده الألباني"},{t:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ.",c:1,s:"رَوَاهُ الْبُخَارِيُّ (3370) وَمُسْلِمٌ (908) عَنْ كَعْبِ بْنِ عُجْرَةَ."}]},{k:"qurani",ar:"الأدعية القرآنية",en:"Quranic duas",items:[{t:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",c:1,s:"القرآن الكريم — سورة البقرة: 201"},{t:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",c:1,s:"القرآن الكريم — سورة البقرة: 250"},{t:"رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",c:1,s:"القرآن الكريم — سورة البقرة: 286"},{t:"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ",c:1,s:"القرآن الكريم — سورة آل عمران: 8"},{t:"رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ",c:1,s:"القرآن الكريم — سورة آل عمران: 16"},{t:"رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ",c:1,s:"القرآن الكريم — سورة آل عمران: 38"},{t:"رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِ
